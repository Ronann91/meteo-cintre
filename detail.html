function ecartNorm(val, ref) {
  if(val===null||val===undefined||!isFinite(val)) return '';
  const d = parseFloat((val-ref).toFixed(1));
  const sign = d>=0?'+':'';
  const col = d>=5?'#b71c1c':d>=0.5?'#e8604c':d<=-5?'#0d47a1':d<=-0.5?'#4a9edd':'#999';
  return '<span style="color:'+col+';font-size:10px;font-weight:600;margin-left:3px;">'+sign+d+'°</span>';
}

let charts = {};

function b64url(s) { return btoa(unescape(encodeURIComponent(s))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_'); }
function b64urlB(a) { let s=''; a.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_'); }

async function getToken() {
  const now = Math.floor(Date.now()/1000);
  const h = b64url(JSON.stringify({alg:"RS256",typ:"JWT"}));
  const p = b64url(JSON.stringify({iss:SA.client_email,scope:"https://www.googleapis.com/auth/bigquery",aud:"https://oauth2.googleapis.com/token",exp:now+3600,iat:now}));
  const sig = h+"."+p;
  const pem = SA.private_key.replace(/-----BEGIN PRIVATE KEY-----|-----END PRIVATE KEY-----|\n/g,'');
  const der = Uint8Array.from(atob(pem), c=>c.charCodeAt(0));
  const key = await crypto.subtle.importKey("pkcs8", der.buffer, {name:"RSASSA-PKCS1-v1_5",hash:"SHA-256"}, false, ["sign"]);
  const bytes = await crypto.subtle.sign("RSASSA-PKCS1-v1_5", key, new TextEncoder().encode(sig));
  const jwt = sig+"."+b64urlB(new Uint8Array(bytes));
  const r = await fetch("https://oauth2.googleapis.com/token", {method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion="+jwt});
  const d = await r.json();
  if(!d.access_token) throw new Error("Auth: "+JSON.stringify(d));
  return d.access_token;
}

async function queryBQ(token, sql) {
  const r = await fetch("https://bigquery.googleapis.com/bigquery/v2/projects/"+SA.project_id+"/queries", {
    method:"POST",
    headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},
    body:JSON.stringify({query:sql,useLegacySql:false,timeoutMs:15000,location:"europe-west9"})
  });
  const d = await r.json();
  if(d.error) throw new Error(d.error.message);
  return d;
}

function parseRows(res) {
  if(!res.rows) return [];
  const f = res.schema.fields.map(f=>f.name);
  return res.rows.map(r=>{const o={};r.f.forEach((v,i)=>o[f[i]]=v.v);return o;});
}

function n(v) { return (v!==null&&v!==''&&v!==undefined)?parseFloat(v):null; }
function fmt(v,d=1) { return (v!==null&&v!==''&&v!==undefined)?parseFloat(v).toFixed(d):'—'; }
function pad(x) { return String(x).padStart(2,'0'); }
function tempIcon(t) { if(t===null)return'🌡️'; if(t>=35)return'🥵'; if(t>=25)return'☀️'; if(t>=15)return'🌤️'; if(t>=5)return'🌥️'; return'🥶'; }

function heatColor(val,min,max,type) {
  if(val===null||!isFinite(val)||min===max) return '';
  const r = Math.max(0,Math.min(1,(val-min)/(max-min)));
  if(type==='temp') return 'background:rgba('+(Math.round(55+r*180))+','+(Math.round(130-r*80))+','+(Math.round(221-r*190))+',0.18);';
  if(type==='rain') return 'background:rgba(74,158,221,'+(0.08+r*0.35)+');';
  if(type==='wind') return 'background:rgba(29,158,117,'+(0.08+r*0.35)+');';
  if(type==='humidity') return 'background:rgba(100,180,255,'+(0.08+r*0.35)+');';
  return '';
}

function makeChart(id,type,labels,datasets,opts) {
  opts = opts||{};
  if(charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id).getContext('2d');
  const units = {cTemp:'°C',cPluie:' mm',cVent:' km/h',cSoleil:' W/m²'};
  const scales = {
    x:{ticks:{color:'#ccc',font:{size:9},maxTicksLimit:7},grid:{color:'rgba(0,0,0,0.03)'}},
    y:{ticks:{color:'#ccc',font:{size:9}},grid:{color:'rgba(0,0,0,0.03)'},beginAtZero:opts.y0!==false}
  };
  if(opts.y2) scales.y2 = {position:'right',ticks:{color:'#e8a020',font:{size:9}},grid:{drawOnChartArea:false},beginAtZero:true};
  charts[id] = new Chart(ctx,{
    type:type,
    data:{labels:labels,datasets:datasets},
    options:{
      responsive:true,maintainAspectRatio:true,aspectRatio:1,animation:false,
      plugins:{
        legend:{display:datasets.length>1,labels:{color:'#ccc',font:{size:10},boxWidth:10,padding:6}},
        tooltip:{mode:'index',intersect:false,callbacks:{label:function(c){return c.dataset.label+': '+parseFloat(c.parsed.y).toFixed(1)+(units[id]||'');}}}
      },
      scales:scales
    }
  });
}

function windDirLabel(deg) {
  if(deg===null||deg===undefined||deg==='') return '—';
  const d = parseFloat(deg);
  if(isNaN(d)) return '—';
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
  return dirs[Math.round(d/22.5)%16];
}

function showModal(heure) {
  const rows = rawRows.filter(r=>r.heure.startsWith(heure+':'));
  if(!rows.length) return;
  const mm2 = function(arr,key){const v=arr.map(function(r){return n(r[key]);}).filter(function(x){return x!==null;});return v.length?[Math.min.apply(null,v),Math.max.apply(null,v)]:[0,0];};
  const thR=mm2(rows,'tempHigh'); const tlR=mm2(rows,'tempLow'); const taR=mm2(rows,'tempAvg');
  const plR=mm2(rows,'pluie'); const prR=mm2(rows,'pluie_rate');
  const vR=mm2(rows,'vent'); const rR=mm2(rows,'rafale'); const hR=mm2(rows,'humidite');
  const html = '<div class="modal-overlay" onclick="closeModal(event)"><div class="modal"><div class="modal-header"><div class="modal-title">Détail '+heure+'h \u2014 '+rows.length+' mesures</div><button class="modal-close" onclick="document.getElementById(\'modal-container\').innerHTML=\'\'">✕</button></div><div style="overflow-x:auto;"><table class="detail-table"><thead><tr><th>Heure</th><th>T°Max</th><th>T°Min</th><th>T°Moy</th><th>Pluie</th><th>Intensité</th><th>Vent</th><th>Rafale</th><th>Dir.</th><th>Humidité</th></tr></thead><tbody>'+rows.map(function(r){return '<tr>'
    +'<td>'+r.heure+'</td>'
    +'<td style="'+heatColor(n(r.tempHigh),thR[0],thR[1],'temp')+'">'+fmt(n(r.tempHigh))+'°</td>'
    +'<td style="'+heatColor(n(r.tempLow),tlR[0],tlR[1],'temp')+'">'+fmt(n(r.tempLow))+'°</td>'
    +'<td style="'+heatColor(n(r.tempAvg),taR[0],taR[1],'temp')+'">'+fmt(n(r.tempAvg))+'°</td>'
    +'<td style="'+heatColor(n(r.pluie),plR[0],plR[1],'rain')+'">'+fmt(n(r.pluie))+' mm</td>'
    +'<td style="'+heatColor(n(r.pluie_rate),prR[0],prR[1],'rain')+'">'+(n(r.pluie_rate)>0?fmt(n(r.pluie_rate))+' mm/h':'—')+'</td>'
    +'<td style="'+heatColor(n(r.vent),vR[0],vR[1],'wind')+'">'+fmt(n(r.vent))+' km/h</td>'
    +'<td style="'+heatColor(n(r.rafale),rR[0],rR[1],'wind')+'">'+fmt(n(r.rafale))+' km/h</td>'
    +'<td>'+windDirLabel(r.dir_vent)+'</td>'
    +'<td style="'+heatColor(n(r.humidite),hR[0],hR[1],'humidity')+'">'+fmt(n(r.humidite),0)+'%</td>'
    +'</tr>';}).join('')+'</tbody></table></div></div></div>';
  document.getElementById('modal-container').innerHTML = html;
}

function closeModal(e) {

function buildHourlyTable(rows) {
  const byHour = {};
  rows.forEach(function(r){const h=r.heure.substring(0,2);if(!byHour[h])byHour[h]=[];byHour[h].push(r);});
  const hours = Object.keys(byHour).sort();
  const agg = hours.map(function(h){
    const rr=byHour[h];
    const vals = function(key){return rr.map(function(r){return n(r[key]);}).filter(function(v){return v!==null;});};
    const lastDir = rr[rr.length-1].dir_vent;
    return {
      heure:h+'h',
      temp_max:Math.max.apply(null,vals('tempHigh')),
      temp_min:Math.min.apply(null,vals('tempLow')),
      temp_moy:vals('tempAvg').reduce(function(a,b){return a+b;},0)/vals('tempAvg').length,
      pluie:vals('pluie').reduce(function(a,b){return a+b;},0),
      intensite_max:Math.max.apply(null,vals('pluie_rate')),
      vent_moy:vals('vent').reduce(function(a,b){return a+b;},0)/vals('vent').length,
      vent_max:Math.max.apply(null,vals('rafale')),
      dir_vent:lastDir,
      humidite_moy:vals('humidite').reduce(function(a,b){return a+b;},0)/vals('humidite').length
    };
  });
  function mm(arr){const f=arr.filter(isFinite);return f.length?[Math.min.apply(null,f),Math.max.apply(null,f)]:[0,0];}
  const tmxR=mm(agg.map(function(r){return r.temp_max;}));
  const tmnR=mm(agg.map(function(r){return r.temp_min;}));
  const tmyR=mm(agg.map(function(r){return r.temp_moy;}));
  const plR=mm(agg.map(function(r){return r.pluie;}));
  const allIn=agg.map(function(r){return r.intensite_max;}).filter(function(v){return isFinite(v)&&v>0;});
  const inR=allIn.length?[Math.min.apply(null,allIn),Math.max.apply(null,allIn)]:[0,0];
  const vmR=mm(agg.map(function(r){return r.vent_moy;}));
  const vxR=mm(agg.map(function(r){return r.vent_max;}));
  const hmR=mm(agg.map(function(r){return r.humidite_moy;}));
  const rows_html = agg.map(function(r){
    const h=r.heure.replace('h','');
    return '<tr onclick="showModal(\''+h+'\')">'
      +'<td>'+r.heure+'</td>'
      +'<td style="'+heatColor(r.temp_max,tmxR[0],tmxR[1],'temp')+'">'+fmt(r.temp_max)+'°</td>'
      +'<td style="'+heatColor(r.temp_min,tmnR[0],tmnR[1],'temp')+'">'+fmt(r.temp_min)+'°</td>'
      +'<td style="'+heatColor(r.temp_moy,tmyR[0],tmyR[1],'temp')+'">'+fmt(r.temp_moy)+'°</td>'
      +'<td style="'+heatColor(r.pluie,plR[0],plR[1],'rain')+'">'+fmt(r.pluie)+' mm</td>'
      +'<td style="'+heatColor(r.intensite_max,inR[0],inR[1],'rain')+'">'+(isFinite(r.intensite_max)&&r.intensite_max>0?fmt(r.intensite_max)+' mm/h':'—')+'</td>'
      +'<td style="'+heatColor(r.vent_moy,vmR[0],vmR[1],'wind')+'">'+fmt(r.vent_moy)+'</td>'
      +'<td style="'+heatColor(r.vent_max,vxR[0],vxR[1],'wind')+'">'+(isFinite(r.vent_max)?fmt(r.vent_max):'—')+'</td>'
      +'<td>'+windDirLabel(r.dir_vent)+'</td>'
      +'<td style="'+heatColor(r.humidite_moy,hmR[0],hmR[1],'humidity')+'">'+fmt(r.humidite_moy,0)+'%</td>'
      +'</tr>';
  }).join('');
  return '<div class="table-section"><div class="section-header" style="padding-left:0;">Tableau horaire — cliquer pour le détail</div><div class="table-card"><div class="table-wrap"><table><thead><tr><th>Heure</th><th>T°Max</th><th>T°Min</th><th>T°Moy</th><th>Pluie</th><th>Intens.</th><th>Vent</th><th>Rafale</th><th>Dir.</th><th>Humidité</th></tr></thead><tbody>'+rows_html+'</tbody></table></div></div></div>';
}

function getSelectedDate() {
  const dp = document.getElementById('datePicker');
  return dp ? dp.value : '';
}

async function loadData() {
  const d = getSelectedDate();
  if(!d) return;
  document.getElementById('top-sub').textContent = new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>Chargement...</div>';

  const qKpi = "SELECT MAX(tempHigh) AS temp_max, MIN(tempLow) AS temp_min, AVG(tempAvg) AS temp_moy, SUM(somme) AS pluie_total, MAX(precipRate) AS pluie_rate_max, MAX(windgustHigh) AS vent_rafale_max, AVG(windspeedAvg) AS vent_moy_jour, AVG(humidityAvg) AS humidite_moy, MAX(humidityHigh) AS humidite_max, MIN(humidityLow) AS humidite_min, MAX(pressureMax) AS pression_max, MIN(pressureMin) AS pression_min, AVG(pressureMax) AS pression_moy, SUM(CASE WHEN solarRadiationHigh>120 THEN 5.0/60.0 ELSE 0 END) AS ens_h FROM `meteo_cintre.data_5_min` WHERE DATE(obsTimeLocal) = '" + d + "'";

  const qLast = "SELECT tempHigh AS temp_actuelle, windspeedAvg AS vent_actuel, humidityAvg AS hum_actuelle, pressureMax AS pression_actuelle, solarRadiationHigh AS soleil_actuel, FORMAT_TIMESTAMP('%H:%M', obsTimeLocal) AS heure FROM `meteo_cintre.data_5_min` WHERE DATE(obsTimeLocal) = '" + d + "' ORDER BY obsTimeLocal DESC LIMIT 1";

  const qEx = "SELECT FORMAT_TIMESTAMP('%H:%M', t_max.obsTimeLocal) AS heure_temp_max, FORMAT_TIMESTAMP('%H:%M', t_min.obsTimeLocal) AS heure_temp_min, FORMAT_TIMESTAMP('%H:%M', p_max.obsTimeLocal) AS heure_pluie_max, FORMAT_TIMESTAMP('%H:%M', h_max.obsTimeLocal) AS heure_hum_max, FORMAT_TIMESTAMP('%H:%M', h_min.obsTimeLocal) AS heure_hum_min, FORMAT_TIMESTAMP('%H:%M', v_max.obsTimeLocal) AS heure_vent_max, FORMAT_TIMESTAMP('%H:%M', pr_max.obsTimeLocal) AS heure_pression_max, FORMAT_TIMESTAMP('%H:%M', pr_min.obsTimeLocal) AS heure_pression_min FROM (SELECT obsTimeLocal FROM `meteo_cintre.data_5_min` WHERE DATE(obsTimeLocal) = '" + d + "' ORDER BY tempHigh DESC LIMIT 1) t_max, (SELECT obsTimeLocal FROM `meteo_cintre.data_5_min` WHERE DATE(obsTimeLocal) = '" + d + "' ORDER BY tempLow ASC LIMIT 1) t_min, (SELECT obsTimeLocal FROM `meteo_cintre.data_5_min` WHERE DATE(obsTimeLocal) = '" + d + "' ORDER BY precipRate DESC LIMIT 1) p_max, (SELECT obsTimeLocal FROM `meteo_cintre.data_5_min` WHERE DATE(obsTimeLocal) = '" + d + "' ORDER BY humidityHigh DESC LIMIT 1) h_max, (SELECT obsTimeLocal FROM `meteo_cintre.data_5_min` WHERE DATE(obsTimeLocal) = '" + d + "' ORDER BY humidityLow ASC LIMIT 1) h_min, (SELECT obsTimeLocal FROM `meteo_cintre.data_5_min` WHERE DATE(obsTimeLocal) = '" + d + "' ORDER BY windgustHigh DESC LIMIT 1) v_max, (SELECT obsTimeLocal FROM `meteo_cintre.data_5_min` WHERE DATE(obsTimeLocal) = '" + d + "' ORDER BY pressureMax DESC LIMIT 1) pr_max, (SELECT obsTimeLocal FROM `meteo_cintre.data_5_min` WHERE DATE(obsTimeLocal) = '" + d + "' ORDER BY pressureMin ASC LIMIT 1) pr_min";

  const qChart = "SELECT FORMAT_TIMESTAMP('%H:%M', obsTimeLocal) AS heure, tempHigh, tempLow, AVG(tempAvg) OVER (ORDER BY obsTimeLocal ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS tempMoyCumul, somme AS pluie, precipRate AS pluie_rate, windspeedAvg AS vent, windgustHigh AS rafale, winddirAvg AS dir_vent, humidityAvg AS humidite, pressureMax AS pression, solarRadiationHigh AS soleil, tempAvg FROM `meteo_cintre.data_5_min` WHERE DATE(obsTimeLocal) = '" + d + "' ORDER BY obsTimeLocal ASC";

  try {
    const token = await getToken();
    const [kpiRes,lastRes,exRes,chartRes] = await Promise.all([
      queryBQ(token,qKpi), queryBQ(token,qLast), queryBQ(token,qEx), queryBQ(token,qChart)
    ]);

    const k = parseRows(kpiRes)[0]||{};
    const last = parseRows(lastRes)[0]||{};
    const ex = parseRows(exRes)[0]||{};
    const rows = parseRows(chartRes);
    rawRows = rows;
    const labels = rows.map(function(r){return r.heure;});

    const tempActuelle = n(last.temp_actuelle);
    const delta = (n(k.temp_max)!==null&&n(k.temp_min)!==null)?(n(k.temp_max)-n(k.temp_min)).toFixed(1):'—';
    const _moisD = new Date(d+'T12:00:00').getMonth()+1;
    const _nrD = NORMALES_RENNES[_moisD]||NORMALES_RENNES[1];
    const _eMax = ecartNorm(n(k.temp_max), _nrD.tmax);
    const _eMin = ecartNorm(n(k.temp_min), _nrD.tmin);
    const _eMoy = ecartNorm(n(k.temp_moy), _nrD.tmoy);
    const ensH = parseFloat(k.ens_h||0);
    const ensHH = Math.floor(ensH);
    const ensMM = Math.round((ensH-ensHH)*60);
    const ensStr = ensHH>0?ensHH+'H'+pad(ensMM):ensMM+'min';

    document.getElementById('content').innerHTML =
      '<div class="main-temp-card">'
        +'<div class="main-temp-left">'
          +'<div class="main-temp-label">Température moyenne</div>'
          +'<div class="main-temp-value">'+fmt(n(k.temp_moy))+'<sup>°C</sup></div>'
          +'<div class="main-temp-meta">'
            +'<div class="meta-item"><b>↑ '+fmt(k.temp_max)+'°C'+_eMax+'</b><span>'+( ex.heure_temp_max||'—')+'</span></div>'
            +'<div class="meta-item"><b>↓ '+fmt(k.temp_min)+'°C'+_eMin+'</b><span>'+(ex.heure_temp_min||'—')+'</span></div>'
            +'<div class="meta-item"><b>Moy '+fmt(k.temp_moy)+'°C'+_eMoy+'</b></div>'
            +'<div class="meta-item"><b>Δ '+delta+'°C</b></div>'
          +'</div>'
          +'<div style="font-size:9px;color:#ccc;margin-top:5px;line-height:1.4;">Écarts vs normales Rennes-Saint-Jacques (réf. 1991–2020, Météo-France)</div>'
        +'</div>'
        +'<div class="main-temp-icon">'+tempIcon(n(k.temp_moy))+'</div>'
      +'</div>'
      +'<div class="kpi-grid">'
        +'<div class="kpi-card"><div class="kpi-card-header"><div class="kpi-icon blue">🌧️</div><div class="kpi-card-title">Pluie du jour</div></div><div class="kpi-card-value">'+fmt(k.pluie_total)+'<span class="kpi-card-unit"> mm</span></div><div class="kpi-sub-grid"><div class="kpi-sub-item"><b>'+fmt(k.pluie_rate_max)+' mm/h</b><span>Intensité max</span></div><div class="kpi-sub-item"><b>'+(ex.heure_pluie_max||'—')+'</b><span>heure max</span></div></div></div>'
        +'<div class="kpi-card"><div class="kpi-card-header"><div class="kpi-icon teal">💨</div><div class="kpi-card-title">Vent</div></div><div class="kpi-card-value">'+fmt(k.vent_moy_jour,1)+'<span class="kpi-card-unit"> km/h</span></div><div class="kpi-sub-grid"><div class="kpi-sub-item"><b>'+fmt(k.vent_rafale_max,1)+' km/h</b><span>Rafale max</span></div><div class="kpi-sub-item"><b>'+(ex.heure_vent_max||'—')+'</b><span>heure rafale max</span></div></div></div>'
        +'<div class="kpi-card"><div class="kpi-card-header"><div class="kpi-icon amber">☀️</div><div class="kpi-card-title">Ensoleillement</div></div><div class="kpi-card-value">'+ensStr+'</div><div class="kpi-sub-single">Rayonnement max<br><b>'+fmt(n(k.pluie_rate_max),0)+' W/m²</b></div></div>'
        +'<div class="kpi-card"><div class="kpi-card-header"><div class="kpi-icon pink">💦</div><div class="kpi-card-title">Humidité</div></div><div class="kpi-card-value">'+fmt(k.humidite_moy,0)+'<span class="kpi-card-unit">%</span></div><div class="kpi-sub-grid"><div class="kpi-sub-item"><b>↑ '+fmt(k.humidite_max,0)+'%</b><span>'+(ex.heure_hum_max||'—')+'</span></div><div class="kpi-sub-item"><b>↓ '+fmt(k.humidite_min,0)+'%</b><span>'+(ex.heure_hum_min||'—')+'</span></div></div></div>'
        +'<div class="kpi-card full"><div class="kpi-card-header"><div class="kpi-icon purple">🔵</div><div class="kpi-card-title">Pression</div></div><div class="kpi-card-value">'+fmt(k.pression_moy,0)+'<span class="kpi-card-unit"> hPa</span></div><div class="kpi-sub-grid"><div class="kpi-sub-item"><b>↑ '+fmt(k.pression_max,0)+' hPa</b><span>'+(ex.heure_pression_max||'—')+'</span></div><div class="kpi-sub-item"><b>↓ '+fmt(k.pression_min,0)+' hPa</b><span>'+(ex.heure_pression_min||'—')+'</span></div></div></div>'
      +'</div>'
      + buildHourlyTable(rows)
      +'<div class="section-header">Graphiques</div>'
      +'<div class="chart-card"><div class="chart-card-title"><span>🌡️ Température</span><em>°C</em></div><canvas id="cTemp"></canvas></div>'
      +'<div class="chart-card"><div class="chart-card-title"><span>🌧️ Pluie</span><em>mm</em></div><canvas id="cPluie"></canvas></div>'
      +'<div class="chart-card"><div class="chart-card-title"><span>💨 Vent</span><em>km/h</em></div><canvas id="cVent"></canvas></div>'
      +'<div class="chart-card"><div class="chart-card-title"><span>☀️ Rayonnement</span><em>W/m²</em></div><canvas id="cSoleil"></canvas></div>'
      +'<div class="chart-card"><div class="chart-card-title"><span>💦 Humidité</span><em>%</em></div><canvas id="cHumidite"></canvas></div>'
      +'<div class="chart-card"><div class="chart-card-title"><span>🔵 Pression</span><em>hPa</em></div><canvas id="cPression"></canvas></div>'
      +'<div class="pb"></div>';

    makeChart('cTemp','line',labels,[
      {label:'Max',data:rows.map(function(r){return n(r.tempHigh);}),borderColor:'#e8604c',backgroundColor:'transparent',tension:0.4,pointRadius:0,borderWidth:2},
      {label:'Min',data:rows.map(function(r){return n(r.tempLow);}),borderColor:'#4a9edd',backgroundColor:'rgba(74,158,221,0.06)',fill:'-1',tension:0.4,pointRadius:0,borderWidth:2},
      {label:'Moy',data:rows.map(function(r){return n(r.tempMoyCumul);}),borderColor:'#bbb',backgroundColor:'transparent',tension:0.4,pointRadius:0,borderWidth:1.5,borderDash:[4,3]}
    ],{y0:false});

    // Agrégat horaire pluie
    const pByHour = {};
    rows.forEach(function(r){
      const h = r.heure.substring(0,2);
      if(!pByHour[h]) pByHour[h]={cumul:0,intensite:0};
      pByHour[h].cumul += n(r.pluie)||0;
      pByHour[h].intensite = Math.max(pByHour[h].intensite, n(r.pluie_rate)||0);
    });
    const pHours = Object.keys(pByHour).sort();
    const pLabels = pHours.map(function(h){return h+'h';});
    const pCumul = pHours.map(function(h){return parseFloat(pByHour[h].cumul.toFixed(2));});
    const pIntens = pHours.map(function(h){return parseFloat(pByHour[h].intensite.toFixed(2));});
    let pRunning = 0;
    const pRunningTotal = pHours.map(function(h){pRunning+=pByHour[h].cumul;return parseFloat(pRunning.toFixed(2));});
    makeChart('cPluie','bar',pLabels,[
      {label:'Précip. (mm)',data:pCumul,backgroundColor:'rgba(74,158,221,0.7)',borderRadius:2},
      {label:'Intensité max (mm/h)',data:pIntens,backgroundColor:'rgba(232,96,76,0.6)',borderRadius:2},
      {label:'Cumul (mm)',data:pRunningTotal,type:'line',borderColor:'#1a3a6a',backgroundColor:'transparent',tension:0.3,pointRadius:0,borderWidth:2}
    ],{y0:true});

    // Graphique vent avec surface colorée par direction (16 secteurs)
    (function(){
      const DIR16_COLORS = [
        'rgba(102,126,234,0.55)','rgba(140,140,220,0.55)','rgba(180,160,200,0.55)','rgba(210,180,150,0.55)',
        'rgba(245,197,24,0.55)','rgba(240,170,30,0.55)','rgba(235,140,60,0.55)','rgba(235,110,70,0.55)',
        'rgba(232,96,76,0.55)','rgba(200,90,100,0.55)','rgba(160,100,130,0.55)','rgba(100,120,160,0.55)',
        'rgba(29,158,117,0.55)','rgba(50,150,150,0.55)','rgba(70,140,190,0.55)','rgba(90,130,215,0.55)'
      ];
      const DIR16_LABELS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
      function dirToColor(deg){if(deg===null)return 'rgba(200,200,200,0.3)';return DIR16_COLORS[Math.round(deg/22.5)%16];}
      function dirToLabel(deg){if(deg===null)return '—';return DIR16_LABELS[Math.round(deg/22.5)%16];}
      const coloredFillPlugin = {
        id:'coloredFill',
        beforeDatasetsDraw:function(chart){
          const meta=chart.getDatasetMeta(0);
          const {ctx,chartArea:{bottom},scales:{x,y}}=chart;
          const dirData=rows.map(function(r){return n(r.dir_vent);});
          ctx.save();
          ctx.beginPath();ctx.rect(chart.chartArea.left,chart.chartArea.top,chart.chartArea.width,chart.chartArea.height);ctx.clip();
          for(let i=0;i<meta.data.length-1;i++){
            const p1=meta.data[i],p2=meta.data[i+1];
            if(!p1||!p2)continue;
            ctx.beginPath();ctx.moveTo(p1.x,bottom);ctx.lineTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p2.x,bottom);ctx.closePath();
            ctx.fillStyle=dirToColor(dirData[i]);ctx.fill();
          }
          ctx.restore();
        }
      };
      const legendDatasets=[
        {label:'Nord', borderColor:'rgba(102,126,234,0.8)',backgroundColor:'rgba(102,126,234,0.8)',data:[],pointRadius:0,borderWidth:8,type:'line'},
        {label:'Est',  borderColor:'rgba(245,197,24,0.8)', backgroundColor:'rgba(245,197,24,0.8)', data:[],pointRadius:0,borderWidth:8,type:'line'},
        {label:'Sud',  borderColor:'rgba(232,96,76,0.8)',  backgroundColor:'rgba(232,96,76,0.8)',  data:[],pointRadius:0,borderWidth:8,type:'line'},
        {label:'Ouest',borderColor:'rgba(29,158,117,0.8)',backgroundColor:'rgba(29,158,117,0.8)', data:[],pointRadius:0,borderWidth:8,type:'line'}
      ];
      if(charts['cVent'])charts['cVent'].destroy();
      const ctx=document.getElementById('cVent').getContext('2d');
      charts['cVent']=new Chart(ctx,{
        type:'line',
        data:{labels:labels,datasets:[
          {label:'Vent moy.',data:rows.map(function(r){return n(r.vent);}),borderColor:'rgba(30,30,30,0.7)',backgroundColor:'transparent',fill:false,tension:0.3,pointRadius:0,borderWidth:1.5},
          {label:'Rafale',data:rows.map(function(r){return n(r.rafale);}),borderColor:'rgba(150,150,150,0.6)',backgroundColor:'transparent',tension:0.3,pointRadius:0,borderWidth:1,borderDash:[3,3]}
        ].concat(legendDatasets)},
        options:{
          responsive:true,maintainAspectRatio:true,aspectRatio:1,animation:false,
          plugins:{
            legend:{display:true,labels:{color:'#999',font:{size:10},boxWidth:12,padding:8,filter:function(item){return item.datasetIndex>=1;}}},
            tooltip:{mode:'index',intersect:false,callbacks:{label:function(c){
              if(c.datasetIndex===0){const dir=n(rows[c.dataIndex]&&rows[c.dataIndex].dir_vent);return 'Vent: '+c.parsed.y.toFixed(1)+' km/h ('+dirToLabel(dir)+')';}
              if(c.datasetIndex===1)return 'Rafale: '+c.parsed.y.toFixed(1)+' km/h';
              return null;
            }}}
          },
          scales:{
            x:{ticks:{color:'#ccc',font:{size:9},maxTicksLimit:7},grid:{color:'rgba(0,0,0,0.03)'}},
            y:{ticks:{color:'#ccc',font:{size:9}},grid:{color:'rgba(0,0,0,0.04)'},beginAtZero:true}
          }
        },
        plugins:[coloredFillPlugin]
      });
    })();

    makeChart('cSoleil','bar',labels,[
      {label:'Ensoleillement',data:rows.map(function(r){return n(r.soleil)>150?n(r.soleil):null;}),backgroundColor:'rgba(245,197,24,0.5)',borderRadius:0,yAxisID:'y'},
      {label:'W/m²',data:rows.map(function(r){return n(r.soleil);}),type:'line',borderColor:'#e8a020',backgroundColor:'transparent',tension:0.3,pointRadius:0,borderWidth:1,yAxisID:'y'}
    ],{y0:true});

    makeChart('cHumidite','line',labels,[
      {label:'Humidité',data:rows.map(function(r){return n(r.humidite);}),borderColor:'#4a9edd',backgroundColor:'rgba(74,158,221,0.08)',fill:true,tension:0.3,pointRadius:0,borderWidth:2}
    ],{y0:true});

    makeChart('cPression','line',labels,[
      {label:'Pression',data:rows.map(function(r){return n(r.pression);}),borderColor:'#764ba2',backgroundColor:'rgba(118,75,162,0.08)',fill:true,tension:0.3,pointRadius:0,borderWidth:2}
    ],{y0:false});

  } catch(e) {
    document.getElementById('content').innerHTML = '<div style="padding:16px"><div class="error">⚠️ '+e.message+'</div></div>';
  }
}

// Init date picker sur hier
(function(){
  const dp = document.getElementById('datePicker');
  const hier = new Date();
  hier.setDate(hier.getDate()-1);
  dp.value = hier.toISOString().split('T')[0];
})();

loadData();
</script>
</body>
