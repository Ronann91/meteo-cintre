<script>
const PROXY_URL = "https://europe-west9-mystic-aileron-471209-p6.cloudfunctions.net/query-proxy-meteo";

const NORMALES_RENNES = {
  1: {tmin: 3.3, tmax: 9.2, tmoy: 6.0, pr: 66.6},
  2: {tmin: 2.9, tmax: 10.3, tmoy: 6.3, pr: 51.6},
  3: {tmin: 4.5, tmax: 13.2, tmoy: 8.5, pr: 48.9},
  4: {tmin: 6.0, tmax: 16.0, tmoy: 10.7, pr: 51.2},
  5: {tmin: 9.3, tmax: 19.3, tmoy: 14.1, pr: 58.1},
  6: {tmin: 12.1, tmax: 22.6, tmoy: 17.1, pr: 50.9},
  7: {tmin: 13.7, tmax: 24.8, tmoy: 18.9, pr: 44.0},
  8: {tmin: 13.7, tmax: 24.8, tmoy: 18.8, pr: 43.5},
  9: {tmin: 11.4, tmax: 21.9, tmoy: 16.2, pr: 56.6},
  10: {tmin: 9.3, tmax: 17.2, tmoy: 12.8, pr: 73.1},
  11: {tmin: 5.9, tmax: 12.5, tmoy: 8.9, pr: 73.2},
  12: {tmin: 3.6, tmax: 9.6, tmoy: 6.4, pr: 73.3},
};
function ecartNorm(val, ref) {
  if(val===null||val===undefined||!isFinite(val)) return '';
  const d = parseFloat((val-ref).toFixed(1));
  const sign = d>=0?'+':'';
  const col = d>=5?'#b71c1c':d>=0.5?'#e8604c':d<=-5?'#0d47a1':d<=-0.5?'#4a9edd':'var(--text-muted)';
  return '<span style="color:'+col+';font-size:10px;font-weight:600;margin-left:3px;">'+sign+d+'°</span>';
}

let charts = {};
let rawRows = [];

async function queryBQ(sql) {
  const r = await fetch(PROXY_URL, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({query: sql})
  });
  const d = await r.json();
  if(d.error) { const err = new Error(d.error); err.quotaExceeded = !!d.quotaExceeded; throw err; }
  return d;
}

function parseRows(res) {
  if(!res.rows) return [];
  const f = res.schema.fields.map(f=>f.name);
  return res.rows.map(r=>{const o={};r.f.forEach((v,i)=>o[f[i]]=v.v);return o;});
}

function n(v) { return (v!==null&&v!==''&&v!==undefined)?parseFloat(v):null; }
function fmt(v,d=1) { return (v!==null&&v!==''&&v!==undefined)?parseFloat(v).toFixed(d):'—'; }
function pad(x) { return String(x).padStart(2,'0'); }
function tempIcon(t) { if(t===null)return'🌡️'; if(t>=35)return'🥵'; if(t>=25)return'☀️'; if(t>=15)return'🌤️'; if(t>=5)return'🌥️'; return'🥶'; }

function heatColor(val,min,max,type) {
  if(val===null||!isFinite(val)||min===max) return '';
  const r = Math.max(0,Math.min(1,(val-min)/(max-min)));
  if(type==='temp') return 'background:rgba('+(Math.round(55+r*180))+','+(Math.round(130-r*80))+','+(Math.round(221-r*190))+',0.18);';
  if(type==='rain') return 'background:rgba(74,158,221,'+(0.08+r*0.35)+');';
  if(type==='wind') return 'background:rgba(29,158,117,'+(0.08+r*0.35)+');';
  if(type==='humidity') return 'background:rgba(100,180,255,'+(0.08+r*0.35)+');';
  return '';
}

const RECORDS_CACHE_KEY = 'meteo_records_cache_detail_v2';

function todayDateStr() {
  const parts = new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/Paris', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date());
  const o = {}; parts.forEach(p => o[p.type] = p.value);
  return `${o.year}-${o.month}-${o.day}`;
}

// Cache des "top 10 historiques" (all-time + par mois calendaire), indépendant du jour
// consulté ici puisque records.html/index.html les alimentent déjà. Contrairement à la
// page "Aujourd'hui", pas besoin d'exclure le jour affiché : c'est un jour déjà écoulé
// (ou en cours si on regarde aujourd'hui, ce qui reste correct à afficher tel quel).
async function getRecordsCache(month) {
  const dateStr = todayDateStr();
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(RECORDS_CACHE_KEY)); } catch(e) {}
  if (!cache || cache.date !== dateStr) cache = {date: dateStr, all: null, months: {}};

  function qReading(col, extraWhere, order, monthFilter) {
    return `SELECT ${col} AS val FROM \`meteo_cintre.raw_data_v2\` WHERE TRUE${extraWhere||''}${monthFilter||''} QUALIFY ROW_NUMBER() OVER (PARTITION BY DATE(obsTimeUtc,"Europe/Paris") ORDER BY ${col} ${order})=1 ORDER BY val ${order} LIMIT 10`;
  }
  function qDaily(agg, extraWhere, order, monthFilter, minCount) {
    const having = minCount ? ` HAVING COUNT(*)>=${minCount}` : '';
    return `SELECT val FROM (SELECT ${agg} AS val FROM \`meteo_cintre.raw_data_v2\` WHERE TRUE${extraWhere||''}${monthFilter||''} GROUP BY DATE(obsTimeUtc,"Europe/Paris")${having}) ORDER BY val ${order} LIMIT 10`;
  }
  async function fetchScope(monthFilter) {
    const jobs = {
      temp_max:      qDaily('MAX(tempHigh)', '', 'DESC', monthFilter, null),
      temp_min:      qDaily('MIN(tempLow)', '', 'ASC', monthFilter, null),
      temp_moy:      qDaily('AVG(tempAvg)', '', 'DESC', monthFilter, 280),
      amplitude:     qDaily('MAX(tempHigh)-MIN(tempLow)', '', 'DESC', monthFilter, 280),
      pluie_jour:    qDaily('SUM(somme)', ' AND precipRate<150', 'DESC', monthFilter, null),
      vent_moy_jour: qDaily('AVG(windspeedAvg)', '', 'DESC', monthFilter, null),
      intensite:     qReading('precipRate', ' AND precipRate<150', 'DESC', monthFilter),
      rafale:        qReading('windgustHigh', '', 'DESC', monthFilter)
    };
    const keys = Object.keys(jobs);
    const results = await Promise.all(keys.map(k => queryBQ(jobs[k])));
    const data = {};
    keys.forEach((k,i) => { data[k] = parseRows(results[i]).map(r=>n(r.val)).filter(v=>v!==null); });
    return data;
  }

  if (!cache.all) {
    try { cache.all = await fetchScope(''); } catch(e) { cache.all = {}; }
  }
  if (month && !cache.months[month]) {
    const monthFilter = ` AND EXTRACT(MONTH FROM DATE(obsTimeUtc,"Europe/Paris")) = ${month}`;
    try { cache.months[month] = await fetchScope(monthFilter); } catch(e) { cache.months[month] = {}; }
  }

  try { localStorage.setItem(RECORDS_CACHE_KEY, JSON.stringify(cache)); } catch(e) {}
  return cache;
}

function computeRank(list, value, asc) {
  if (value === null || value === undefined || !isFinite(value) || !list || !list.length) return null;
  const better = list.filter(v => asc ? v < value : v > value).length;
  const rank = better + 1;
  return rank <= 10 ? rank : null;
}

function rankBadge(rank, scopeLabel) {
  if (!rank) return '';
  const cls = rank===1 ? 'rec-1' : rank<=3 ? 'rec-3' : 'rec-10';
  const icon = rank===1 ? '🥇' : rank<=3 ? '🏆' : '🏅';
  return ` <span class="rec-badge ${cls}">${icon} #${rank} ${scopeLabel}</span>`;
}

function recordBadge(recCache, key, value, asc, month) {
  const rMonth = computeRank((recCache.months[month]||{})[key], value, asc);
  const rAll = computeRank((recCache.all||{})[key], value, asc);
  return rankBadge(rMonth, 'mois') + rankBadge(rAll, 'all-time');
}

function makeChart(id,type,labels,datasets,opts) {
  opts = opts||{};
  if(charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id).getContext('2d');
  const units = {cTemp:'°C',cPluie:' mm',cVent:' km/h',cSoleil:' W/m²'};
  const scales = {
    x:{ticks:{color:'#ccc',font:{size:9},maxTicksLimit:7},grid:{color:'rgba(0,0,0,0.03)'}},
    y:{ticks:{color:'#ccc',font:{size:9}},grid:{color:'rgba(0,0,0,0.03)'},beginAtZero:opts.y0!==false}
  };
  if(opts.y2) scales.y2 = {position:'right',ticks:{color:'#e8a020',font:{size:9}},grid:{drawOnChartArea:false},beginAtZero:true};
  charts[id] = new Chart(ctx,{
    type:type,
    data:{labels:labels,datasets:datasets},
    options:{
      responsive:true,maintainAspectRatio:true,aspectRatio:1,animation:false,
      plugins:{
        legend:{display:datasets.length>1,labels:{color:'#ccc',font:{size:10},boxWidth:10,padding:6}},
        tooltip:{mode:'index',intersect:false,callbacks:{label:function(c){return c.dataset.label+': '+parseFloat(c.parsed.y).toFixed(1)+(units[id]||'');}}}
      },
      scales:scales
    }
  });
}

function windDirLabel(deg) {
  if(deg===null||deg===undefined||deg==='') return '—';
  const d = parseFloat(deg);
  if(isNaN(d)) return '—';
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
  return dirs[Math.round(d/22.5)%16];
}

function showModal(heure) {
  const rows = rawRows.filter(r=>r.heure.startsWith(heure+':'));
  if(!rows.length) return;
  const mm2 = function(arr,key){const v=arr.map(function(r){return n(r[key]);}).filter(function(x){return x!==null;});return v.length?[Math.min.apply(null,v),Math.max.apply(null,v)]:[0,0];};
  const thR=mm2(rows,'tempHigh'); const tlR=mm2(rows,'tempLow'); const taR=mm2(rows,'tempAvg');
  const plR=mm2(rows,'pluie'); const prR=mm2(rows,'pluie_rate');
  const vR=mm2(rows,'vent'); const rR=mm2(rows,'rafale'); const hR=mm2(rows,'humidite');

function buildHourlyTable(rows) {
  const byHour = {};
  rows.forEach(function(r){const h=r.heure.substring(0,2);if(!byHour[h])byHour[h]=[];byHour[h].push(r);});
  const hours = Object.keys(byHour).sort();
  const agg = hours.map(function(h){
    const rr=byHour[h];
    const vals = function(key){return rr.map(function(r){return n(r[key]);}).filter(function(v){return v!==null;});};
    const lastDir = rr[rr.length-1].dir_vent;
    return {
      heure:h+'h',
      temp_max:Math.max.apply(null,vals('tempHigh')),
      temp_min:Math.min.apply(null,vals('tempLow')),
      temp_moy:vals('tempAvg').reduce(function(a,b){return a+b;},0)/vals('tempAvg').length,
      pluie:vals('pluie').reduce(function(a,b){return a+b;},0),
      intensite_max:Math.max.apply(null,vals('pluie_rate')),
      vent_moy:vals('vent').reduce(function(a,b){return a+b;},0)/vals('vent').length,
      vent_max:Math.max.apply(null,vals('rafale')),
      dir_vent:lastDir,
      humidite_moy:vals('humidite').reduce(function(a,b){return a+b;},0)/vals('humidite').length
    };
  });
  function mm(arr){const f=arr.filter(isFinite);return f.length?[Math.min.apply(null,f),Math.max.apply(null,f)]:[0,0];}
  const tmxR=mm(agg.map(function(r){return r.temp_max;}));
  const tmnR=mm(agg.map(function(r){return r.temp_min;}));
  const tmyR=mm(agg.map(function(r){return r.temp_moy;}));
  const plR=mm(agg.map(function(r){return r.pluie;}));
  const allIn=agg.map(function(r){return r.intensite_max;}).filter(function(v){return isFinite(v)&&v>0;});
  const inR=allIn.length?[Math.min.apply(null,allIn),Math.max.apply(null,allIn)]:[0,0];
  const vmR=mm(agg.map(function(r){return r.vent_moy;}));
  const vxR=mm(agg.map(function(r){return r.vent_max;}));
  const hmR=mm(agg.map(function(r){return r.humidite_moy;}));
  const rows_html = agg.map(function(r){
    const h=r.heure.replace('h','');
    return '<tr onclick="showModal(\''+h+'\')">'
      +'<td>'+r.heure+'</td>'
      +'<td style="'+heatColor(r.temp_max,tmxR[0],tmxR[1],'temp')+'">'+fmt(r.temp_max)+'°</td>'
      +'<td style="'+heatColor(r.temp_min,tmnR[0],tmnR[1],'temp')+'">'+fmt(r.temp_min)+'°</td>'
      +'<td style="'+heatColor(r.temp_moy,tmyR[0],tmyR[1],'temp')+'">'+fmt(r.temp_moy)+'°</td>'
      +'<td style="'+heatColor(r.pluie,plR[0],plR[1],'rain')+'">'+fmt(r.pluie)+' mm</td>'
      +'<td style="'+heatColor(r.intensite_max,inR[0],inR[1],'rain')+'">'+(isFinite(r.intensite_max)&&r.intensite_max>0?fmt(r.intensite_max)+' mm/h':'—')+'</td>'
      +'<td style="'+heatColor(r.vent_moy,vmR[0],vmR[1],'wind')+'">'+fmt(r.vent_moy)+'</td>'
      +'<td style="'+heatColor(r.vent_max,vxR[0],vxR[1],'wind')+'">'+(isFinite(r.vent_max)?fmt(r.vent_max):'—')+'</td>'
      +'<td>'+windDirLabel(r.dir_vent)+'</td>'
      +'<td style="'+heatColor(r.humidite_moy,hmR[0],hmR[1],'humidity')+'">'+fmt(r.humidite_moy,0)+'%</td>'
      +'</tr>';
  }).join('');
  return '<div class="table-section"><div class="section-header" style="padding-left:0;">Tableau horaire — cliquer pour le détail</div><div class="table-card"><div class="table-wrap"><table><thead><tr><th>Heure</th><th>T°Max</th><th>T°Min</th><th>T°Moy</th><th>Pluie</th><th>Intens.</th><th>Vent</th><th>Rafale</th><th>Dir.</th><th>Humidité</th></tr></thead><tbody>'+rows_html+'</tbody></table></div></div></div>';
}

        'rgba(245,197,24,0.55)','rgba(240,170,30,0.55)','rgba(235,140,60,0.55)','rgba(235,110,70,0.55)',
        'rgba(232,96,76,0.55)','rgba(200,90,100,0.55)','rgba(160,100,130,0.55)','rgba(100,120,160,0.55)',
        'rgba(29,158,117,0.55)','rgba(50,150,150,0.55)','rgba(70,140,190,0.55)','rgba(90,130,215,0.55)'
      ];
      const DIR16_LABELS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
      function dirToColor(deg){if(deg===null)return 'rgba(200,200,200,0.3)';return DIR16_COLORS[Math.round(deg/22.5)%16];}
      function dirToLabel(deg){if(deg===null)return '—';return DIR16_LABELS[Math.round(deg/22.5)%16];}
      const coloredFillPlugin = {
        id:'coloredFill',
        beforeDatasetsDraw:function(chart){
          const meta=chart.getDatasetMeta(0);
          const {ctx,chartArea:{bottom},scales:{x,y}}=chart;
          const dirData=rows.map(function(r){return n(r.dir_vent);});
          ctx.save();
          ctx.beginPath();ctx.rect(chart.chartArea.left,chart.chartArea.top,chart.chartArea.width,chart.chartArea.height);ctx.clip();
          for(let i=0;i<meta.data.length-1;i++){
            const p1=meta.data[i],p2=meta.data[i+1];
            if(!p1||!p2)continue;
            ctx.beginPath();ctx.moveTo(p1.x,bottom);ctx.lineTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p2.x,bottom);ctx.closePath();
            ctx.fillStyle=dirToColor(dirData[i]);ctx.fill();
          }
          ctx.restore();
        }
      };
      const legendDatasets=[
        {label:'Nord', borderColor:'rgba(102,126,234,0.8)',backgroundColor:'rgba(102,126,234,0.8)',data:[],pointRadius:0,borderWidth:8,type:'line'},
        {label:'Est',  borderColor:'rgba(245,197,24,0.8)', backgroundColor:'rgba(245,197,24,0.8)', data:[],pointRadius:0,borderWidth:8,type:'line'},
        {label:'Sud',  borderColor:'rgba(232,96,76,0.8)',  backgroundColor:'rgba(232,96,76,0.8)',  data:[],pointRadius:0,borderWidth:8,type:'line'},
        {label:'Ouest',borderColor:'rgba(29,158,117,0.8)',backgroundColor:'rgba(29,158,117,0.8)', data:[],pointRadius:0,borderWidth:8,type:'line'}
      ];
      if(charts['cVent'])charts['cVent'].destroy();
      const ctx=document.getElementById('cVent').getContext('2d');
      charts['cVent']=new Chart(ctx,{
        type:'line',
        data:{labels:labels,datasets:[
          {label:'Vent moy.',data:rows.map(function(r){return n(r.vent);}),borderColor:'rgba(30,30,30,0.7)',backgroundColor:'transparent',fill:false,tension:0.3,pointRadius:0,borderWidth:1.5},
          {label:'Rafale',data:rows.map(function(r){return n(r.rafale);}),borderColor:'rgba(150,150,150,0.6)',backgroundColor:'transparent',tension:0.3,pointRadius:0,borderWidth:1,borderDash:[3,3]}
        ].concat(legendDatasets)},
        options:{
          responsive:true,maintainAspectRatio:true,aspectRatio:1,animation:false,
          plugins:{
            legend:{display:true,labels:{color:'#999',font:{size:10},boxWidth:12,padding:8,filter:function(item){return item.datasetIndex>=1;}}},
            tooltip:{mode:'index',intersect:false,callbacks:{label:function(c){
              if(c.datasetIndex===0){const dir=n(rows[c.dataIndex]&&rows[c.dataIndex].dir_vent);return 'Vent: '+c.parsed.y.toFixed(1)+' km/h ('+dirToLabel(dir)+')';}
              if(c.datasetIndex===1)return 'Rafale: '+c.parsed.y.toFixed(1)+' km/h';
              return null;
            }}}
          },
          scales:{
            x:{ticks:{color:'#ccc',font:{size:9},maxTicksLimit:7},grid:{color:'rgba(0,0,0,0.03)'}},
            y:{ticks:{color:'#ccc',font:{size:9}},grid:{color:'rgba(0,0,0,0.04)'},beginAtZero:true}
          }
        },
        plugins:[coloredFillPlugin]
      });
    })();

    makeChart('cSoleil','bar',labels,[
      {label:'Ensoleillement',data:rows.map(function(r){return n(r.soleil)>150?n(r.soleil):null;}),backgroundColor:'rgba(245,197,24,0.5)',borderRadius:0,yAxisID:'y'},
      {label:'W/m²',data:rows.map(function(r){return n(r.soleil);}),type:'line',borderColor:'#e8a020',backgroundColor:'transparent',tension:0.3,pointRadius:0,borderWidth:1,yAxisID:'y'}
    ],{y0:true});

    makeChart('cHumidite','line',labels,[
      {label:'Humidité',data:rows.map(function(r){return n(r.humidite);}),borderColor:'#4a9edd',backgroundColor:'rgba(74,158,221,0.08)',fill:true,tension:0.3,pointRadius:0,borderWidth:2}
    ],{y0:true});

    makeChart('cPression','line',labels,[
      {label:'Pression',data:rows.map(function(r){return n(r.pression);}),borderColor:'#764ba2',backgroundColor:'rgba(118,75,162,0.08)',fill:true,tension:0.3,pointRadius:0,borderWidth:2}
    ],{y0:false});

  } catch(e) {
    const msg = e.quotaExceeded ? '☁️ Plus de Go pour aujourd\'hui — quota quotidien BigQuery atteint, réessaie demain.' : '⚠️ '+e.message;
    document.getElementById('content').innerHTML = '<div style="padding:16px"><div class="error">'+msg+'</div></div>';
  }
}

const THEME_KEY = 'meteo-theme';
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
  applyTheme(next);
}
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch(e) {}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
}
initTheme();

loadData();
