  const d=await r.json();
  if(!d.access_token)throw new Error("Auth: "+JSON.stringify(d));
  return d.access_token;
}

async function queryBQ(token,sql){
  const r=await fetch("https://bigquery.googleapis.com/bigquery/v2/projects/"+SA.project_id+"/queries",{
    method:"POST",
    headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},
    body:JSON.stringify({query:sql,useLegacySql:false,timeoutMs:30000,location:"europe-west9"})
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d;
}

function parseRows(res){
  if(!res.rows)return[];
  const f=res.schema.fields.map(f=>f.name);
  return res.rows.map(r=>{const o={};r.f.forEach((v,i)=>o[f[i]]=v.v);return o;});
}

function n(v){return(v!==null&&v!==''&&v!==undefined)?parseFloat(v):null;}
function fmt(v,d=1){return(v!==null&&v!==''&&v!==undefined)?parseFloat(v).toFixed(d):'—';}
function pad(x){return String(x).padStart(2,'0');}
function fmtDate(s){if(!s)return'—';const d=new Date(s.includes('T')?s:s+'T12:00:00');return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function fmtDateFull(s){if(!s)return'—';const d=new Date(s.includes('T')?s:s+'T12:00:00');return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});}

function heatColor(val,min,max,type){
  if(val===null||!isFinite(val)||min===max)return'';
  const r=Math.max(0,Math.min(1,(val-min)/(max-min)));
  if(type==='temp')return'background:rgba('+(Math.round(55+r*180))+','+(Math.round(130-r*80))+','+(Math.round(221-r*190))+',0.18);';
  if(type==='rain')return'background:rgba(74,158,221,'+(0.08+r*0.35)+');';
  if(type==='wind')return'background:rgba(29,158,117,'+(0.08+r*0.35)+');';
  if(type==='sun')return'background:rgba(245,197,24,'+(0.08+r*0.35)+');';
  return'';
}

function makeChart(id,type,labels,datasets,opts){
  opts=opts||{};
  if(charts[id])charts[id].destroy();
  const ctx=document.getElementById(id).getContext('2d');
  const units={cTemp:'°C',cPluie:' mm',cVent:' km/h',cSoleil:'h'};
  const scales={
    x:{ticks:{color:'#ccc',font:{size:9},maxTicksLimit:15},grid:{color:'rgba(0,0,0,0.03)'}},
    y:{ticks:{color:'#ccc',font:{size:9}},grid:{color:'rgba(0,0,0,0.03)'},beginAtZero:opts.y0!==false}
  };
  if(opts.y2)scales.y2={position:'right',ticks:{color:'#1a3a6a',font:{size:9}},grid:{drawOnChartArea:false},beginAtZero:true};
  charts[id]=new Chart(ctx,{
    type:type,
    data:{labels:labels,datasets:datasets},
    options:{
      responsive:true,maintainAspectRatio:true,aspectRatio:1.6,animation:false,
      plugins:{
        legend:{display:datasets.length>1,labels:{color:'#ccc',font:{size:10},boxWidth:10,padding:6}},
        tooltip:{mode:'index',intersect:false,callbacks:{label:function(c){return c.dataset.label+': '+parseFloat(c.parsed.y).toFixed(1)+(units[id]||'');}}}
      },
      scales:scales
    }
  });
}

function drawWindRose(canvas, n_pct, s_pct, e_pct, o_pct){
  const ctx = canvas.getContext('2d');
  const cx = canvas.width/2, cy = canvas.height/2;
  const maxR = Math.min(cx,cy)*0.7;
  const dirs = [
    {label:'N', pct:n_pct, angle:-Math.PI/2, color:'rgba(102,126,234,0.7)'},
    {label:'E', pct:e_pct, angle:0,           color:'rgba(245,197,24,0.7)'},
    {label:'S', pct:s_pct, angle:Math.PI/2,   color:'rgba(232,96,76,0.7)'},
    {label:'O', pct:o_pct, angle:Math.PI,     color:'rgba(29,158,117,0.7)'}
  ];
  const max = Math.max(n_pct,s_pct,e_pct,o_pct)||1;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // Cercles de référence
  [0.25,0.5,0.75,1].forEach(function(f){
    ctx.beginPath();
    ctx.arc(cx,cy,maxR*f,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,0,0,0.07)';
    ctx.lineWidth=1;
    ctx.stroke();
  });
  // Axes
  ['N','S','E','O'].forEach(function(_,i){
    const a = i*Math.PI/2 - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*maxR,cy+Math.sin(a)*maxR);
    ctx.strokeStyle='rgba(0,0,0,0.1)';
    ctx.lineWidth=1;
    ctx.stroke();
  });
  // Pétales
  dirs.forEach(function(d){
    const r = maxR*(d.pct/max);
    const spread = Math.PI/6;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,d.angle-spread,d.angle+spread);
    ctx.closePath();
    ctx.fillStyle=d.color;
    ctx.fill();
    // Label
    const lr = maxR+16;
    const lx = cx+Math.cos(d.angle)*lr;
    const ly = cy+Math.sin(d.angle)*lr;
    ctx.fillStyle='#555';
    ctx.font='bold 11px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(d.label+' '+d.pct+'%',lx,ly);
  });
}

function getSelectedRange(){

  const e = document.getElementById('dateEnd').value;

}

  if(!start||!end)return;
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div>Chargement...</div>';
  const labelStart = new Date(start+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});

  document.getElementById('top-sub').textContent=labelStart+' → '+labelEnd;
  const W = "WHERE DATE(obsTimeLocal) BETWEEN '"+start+"' AND '"+end+"'";

  // ---- KPI mensuel ----
  const qKpi = `SELECT
    MAX(tempHigh) AS temp_max, MIN(tempLow) AS temp_min, AVG(tempAvg) AS temp_moy,
    MAX(tempHigh)-MIN(tempLow) AS amplitude,
    SUM(somme) AS pluie_total, MAX(precipRate) AS intensite_max,
    AVG(windspeedAvg) AS vent_moy,
    MAX(windgustHigh) AS rafale_max,
    SUM(CASE WHEN solarRadiationHigh>120 THEN 5.0/60.0 ELSE 0 END) AS ens_total
  FROM \`meteo_cintre.data_5_min\` ${W}`;

  // ---- Extremes dates ----
  const qEx = `SELECT
    FORMAT_DATE('%d/%m/%Y', DATE(t_max.obsTimeLocal)) AS date_temp_max,
    FORMAT_DATE('%d/%m/%Y', DATE(t_min.obsTimeLocal)) AS date_temp_min,
    FORMAT_DATE('%d/%m/%Y', DATE(p_max.obsTimeLocal)) AS date_intensite_max,
    FORMAT_DATE('%d/%m/%Y', DATE(v_max.obsTimeLocal)) AS date_rafale_max,
    FORMAT_DATE('%d/%m/%Y', DATE(vm_max.obsTimeLocal)) AS date_vent_moy_max
  FROM
    (SELECT obsTimeLocal FROM \`meteo_cintre.data_5_min\` ${W} ORDER BY tempHigh DESC LIMIT 1) t_max,
    (SELECT obsTimeLocal FROM \`meteo_cintre.data_5_min\` ${W} ORDER BY tempLow ASC LIMIT 1) t_min,
    (SELECT obsTimeLocal FROM \`meteo_cintre.data_5_min\` ${W} ORDER BY precipRate DESC LIMIT 1) p_max,
    (SELECT obsTimeLocal FROM \`meteo_cintre.data_5_min\` ${W} ORDER BY windgustHigh DESC LIMIT 1) v_max,
    (SELECT obsTimeLocal FROM \`meteo_cintre.data_5_min\` ${W} ORDER BY windspeedAvg DESC LIMIT 1) vm_max`;

  // ---- Agrégats journaliers ----
  const qDaily = `SELECT
    DATE(obsTimeLocal) AS jour,
    MAX(tempHigh) AS temp_max, MIN(tempLow) AS temp_min, AVG(tempAvg) AS temp_moy,
    SUM(somme) AS pluie, MAX(precipRate) AS intensite_max,

  // ---- Comptages seuils ----

    makeChart('cTemp','line',labels,[
      {label:'Min',data:days.map(function(r){return n(r.temp_min);}),borderColor:'#4a9edd',backgroundColor:'rgba(74,158,221,0.06)',fill:false,tension:0.3,pointRadius:2,borderWidth:2},
      {label:'Max',data:days.map(function(r){return n(r.temp_max);}),borderColor:'#e8604c',backgroundColor:'transparent',fill:false,tension:0.3,pointRadius:2,borderWidth:2},
      {label:'Moy',data:days.map(function(r){return n(r.temp_moy);}),borderColor:'#bbb',backgroundColor:'transparent',tension:0.3,pointRadius:0,borderWidth:1.5,borderDash:[4,3]}
    ],{y0:false});

    // Graphique écart vs normales journalières
    (function(){
      // Construire les données normales journalières pour ce mois
      const normData = days.map(function(r){
        const d = new Date(r.jour+'T12:00:00');
        const key = pad(d.getMonth()+1)+'-'+pad(d.getDate());
        const nr = NORM_DAILY[key];
        return nr ? nr.tm : null;
      });
      const obsData = days.map(function(r){ return n(r.temp_moy); });

      // Datasets pour le remplissage rouge/bleu
      // On crée deux datasets fill : un pour le dessus (rouge), un pour le dessous (bleu)
      const aboveData = obsData.map(function(v,i){ return v!==null&&normData[i]!==null&&v>=normData[i]?v:normData[i]; });
      const belowData = obsData.map(function(v,i){ return v!==null&&normData[i]!==null&&v<=normData[i]?v:normData[i]; });

      // Plugin custom pour colorier entre les deux courbes
      const fillPlugin = {
        id:'normFill',
        beforeDatasetsDraw:function(chart){
          const meta0 = chart.getDatasetMeta(0); // normale
          const meta1 = chart.getDatasetMeta(1); // observée
          const ctx = chart.ctx;
          const {chartArea:{left,right,top,bottom}} = chart;
          ctx.save();
          ctx.beginPath(); ctx.rect(left,top,right-left,bottom-top); ctx.clip();

          for(let i=0;i<meta0.data.length-1;i++){
            const n0=meta0.data[i], n1=meta0.data[i+1];
            const o0=meta1.data[i], o1=meta1.data[i+1];
            if(!n0||!n1||!o0||!o1) continue;

            const above0 = o0.y <= n0.y; // y inversé en canvas : petit y = haut
            const above1 = o1.y <= n1.y;

            if(above0 === above1) {
              // Pas de croisement dans ce segment
              ctx.beginPath();
              ctx.moveTo(n0.x, n0.y); ctx.lineTo(n1.x, n1.y);
              ctx.lineTo(o1.x, o1.y); ctx.lineTo(o0.x, o0.y);
              ctx.closePath();
              ctx.fillStyle = above0 ? 'rgba(232,96,76,0.4)' : 'rgba(74,158,221,0.4)';
              ctx.fill();
            } else {
              // Croisement : calcul du point d'intersection
              // Paramétrique : n(t) = n0 + t*(n1-n0), o(t) = o0 + t*(o1-o0)
              // n(t).y = o(t).y => n0.y + t*(n1.y-n0.y) = o0.y + t*(o1.y-o0.y)
              const denom = (n1.y - n0.y) - (o1.y - o0.y);
              const t = Math.abs(denom) < 0.001 ? 0.5 : (o0.y - n0.y) / denom;
              const ix = n0.x + t * (n1.x - n0.x);
              const iy = n0.y + t * (n1.y - n0.y);

              // Première moitié
              ctx.beginPath();
              ctx.moveTo(n0.x, n0.y); ctx.lineTo(ix, iy);
              ctx.lineTo(o0.x, o0.y);
              ctx.closePath();
              ctx.fillStyle = above0 ? 'rgba(232,96,76,0.4)' : 'rgba(74,158,221,0.4)';
              ctx.fill();

              // Deuxième moitié
              ctx.beginPath();
              ctx.moveTo(ix, iy); ctx.lineTo(n1.x, n1.y);
              ctx.lineTo(o1.x, o1.y);
              ctx.closePath();
              ctx.fillStyle = above1 ? 'rgba(232,96,76,0.4)' : 'rgba(74,158,221,0.4)';
              ctx.fill();
            }
          }
          ctx.restore();
        }
      };

      if(charts['cTempNorm']) charts['cTempNorm'].destroy();
      const ctx = document.getElementById('cTempNorm');
      if(!ctx) return;
      charts['cTempNorm'] = new Chart(ctx.getContext('2d'), {
        type:'line',
        data:{labels:labels,datasets:[
          {label:'Normale',data:normData,borderColor:'#1a1a2e',backgroundColor:'transparent',tension:0.3,pointRadius:0,borderWidth:2},
          {label:'Observée',data:obsData,borderColor:'rgba(0,0,0,0)',backgroundColor:'transparent',tension:0.3,pointRadius:0,borderWidth:0}
        ]},
        options:{
          responsive:true,maintainAspectRatio:true,aspectRatio:1.6,animation:false,
          plugins:{
            legend:{display:true,labels:{color:'#999',font:{size:10},boxWidth:10,padding:6,
              filter:function(item){return item.datasetIndex===0;}
            }},
            tooltip:{mode:'index',intersect:false,callbacks:{
              label:function(c){
                if(c.datasetIndex===0) return 'Normale: '+c.parsed.y.toFixed(1)+'°';
                const obs = obsData[c.dataIndex];
                const nrm = normData[c.dataIndex];
                if(obs===null||nrm===null) return '';
                const d = (obs-nrm).toFixed(1);
                return 'Observée: '+obs.toFixed(1)+'° ('+(d>=0?'+':'')+d+'°)';
              }
            }}
          },
          scales:{
            x:{ticks:{color:'#ccc',font:{size:9},maxTicksLimit:10},grid:{color:'rgba(0,0,0,0.03)'}},
            y:{ticks:{color:'#ccc',font:{size:9}},grid:{color:'rgba(0,0,0,0.03)'},title:{display:true,text:'°C',color:'#ccc',font:{size:9}}}
          }
        },
        plugins:[fillPlugin]
      });
    })();

    // Graphique pluie
    makeChart('cPluie','bar',labels,[
      {label:'Précip. (mm)',data:days.map(function(r){return n(r.pluie);}),backgroundColor:'rgba(74,158,221,0.7)',borderRadius:2,yAxisID:'y'},
      {label:'Intensité max (mm/h)',data:days.map(function(r){return n(r.intensite_max)>0?n(r.intensite_max):null;}),type:'scatter',borderColor:'rgba(0,0,0,0)',backgroundColor:'#e8604c',pointRadius:5,pointStyle:'circle',yAxisID:'y'},
      {label:'Cumul (mm)',data:pluieCumul,type:'line',borderColor:'#1a1a2e',backgroundColor:'transparent',tension:0.3,pointRadius:0,borderWidth:2,yAxisID:'y2'}
    ],{y0:true,y2:true});

    // Graphique vent
    makeChart('cVent','line',labels,[
      {label:'Moy (km/h)',data:days.map(function(r){return n(r.vent_moy);}),borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,0.08)',fill:true,tension:0.3,pointRadius:2,borderWidth:2},
      {label:'Rafale max (km/h)',data:days.map(function(r){return n(r.rafale_max);}),borderColor:'#aaa',backgroundColor:'transparent',tension:0.3,pointRadius:0,borderWidth:1.5,borderDash:[3,3]}
    ],{y0:true});

    // Graphique ensoleillement
    makeChart('cSoleil','bar',labels,[
      {label:'Ensoleillement (h)',data:days.map(function(r){return n(r.ens_h);}),backgroundColor:'rgba(245,197,24,0.6)',borderRadius:2}
    ],{y0:true});

  }catch(e){
    document.getElementById('content').innerHTML='<div style="padding:16px"><div class="error">⚠️ '+e.message+'</div></div>';
  }
}

// Init : mois précédent
(function(){
  const now = new Date();
  const firstDay = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const lastDay = new Date(now.getFullYear(), now.getMonth(), 0);
  document.getElementById('dateStart').value = firstDay.getFullYear()+'-'+pad(firstDay.getMonth()+1)+'-01';
  document.getElementById('dateEnd').value = lastDay.getFullYear()+'-'+pad(lastDay.getMonth()+1)+'-'+pad(lastDay.getDate());
})();

loadData();
</script>
</body>
