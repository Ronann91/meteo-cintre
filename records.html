<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Météo — Cintré | Records (V2)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f7f8fa; color: #1a1a2e; min-height: 100vh; }
.top-bar { background: linear-gradient(135deg, #e8604c 0%, #c0392b 100%); padding: 14px 16px 26px; color: white; }
.top-bar-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.top-bar-title { font-size: 18px; font-weight: 700; }
.top-bar-sub { font-size: 11px; opacity: 0.75; }
.refresh-btn { background: rgba(255,255,255,0.2); border: none; border-radius: 20px; padding: 6px 12px; font-size: 12px; color: white; cursor: pointer; }
.month-filter { display: flex; overflow-x: auto; gap: 6px; padding: 12px 16px; scrollbar-width: none; }
.month-filter::-webkit-scrollbar { display: none; }
.month-btn { flex-shrink: 0; border: 1.5px solid #e0e0e0; border-radius: 20px; padding: 5px 12px; font-size: 12px; background: white; color: #555; cursor: pointer; white-space: nowrap; }
.month-btn.active { background: #e8604c; border-color: #e8604c; color: white; font-weight: 600; }
.card-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; padding: 0 16px; margin-bottom: 4px; }
.record-card { background: white; border-radius: 16px; padding: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
.record-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.record-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.record-icon.red { background: #fff0ee; } .record-icon.blue { background: #e8f4ff; }
.record-icon.amber { background: #fff8e6; } .record-icon.teal { background: #e6f9f3; } .record-icon.purple { background: #f3eeff; }
.record-title { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; line-height: 1.3; }
.record-value { font-size: 28px; font-weight: 300; color: #1a1a2e; line-height: 1; }
.record-unit { font-size: 14px; color: #aaa; }
.record-date { font-size: 11px; color: #aaa; margin: 4px 0 8px; }
.record-date b { color: #555; }
.record-extra { font-size: 11px; color: #888; margin: -4px 0 8px; }
details summary { font-size: 11px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 4px; user-select: none; }
details summary::-webkit-details-marker { display: none; }
details[open] summary .arr { transform: rotate(180deg); }
.arr { display: inline-block; transition: transform 0.2s; font-size: 9px; }
.top10-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.top10-table tr { border-bottom: 0.5px solid #f5f5f5; }
.top10-table tr:last-child { border-bottom: none; }
.top10-table td { padding: 5px 3px; font-size: 11px; color: #555; }
.top10-table td:first-child { width: 20px; font-weight: 700; color: #ccc; font-size: 10px; }
.top10-table td:nth-child(2) { font-weight: 600; color: #1a1a2e; }
.top10-table td:last-child { color: #aaa; text-align: right; font-size: 10px; }
.rank-1 { color: #e8604c !important; } .rank-2 { color: #888 !important; } .rank-3 { color: #b8860b !important; }
.section-title { padding: 14px 16px 8px; font-size: 11px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.07em; }
.loading { text-align: center; padding: 4rem 1rem; color: #bbb; }
.spinner { width: 30px; height: 30px; border: 3px solid #f0f0f0; border-top-color: #e8604c; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
.error { background: #fff5f5; border-radius: 16px; padding: 14px 16px; margin: 16px; font-size: 13px; color: #e53e3e; }
@keyframes spin { to { transform: rotate(360deg); } }
nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; z-index: 50; }
nav a { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0; text-decoration: none; color: #aaa; font-size: 10px; gap: 3px; }
nav a.active { color: #e8604c; font-weight: 600; }
.pb { padding-bottom: 80px; }
.tab-bar { display: flex; gap: 0; padding: 0 16px 12px; border-bottom: 1px solid #f0f0f0; background: white; position: sticky; top: 0; z-index: 10; }
.tab-btn { flex: 1; padding: 10px 8px; font-size: 12px; font-weight: 600; border: none; background: none; cursor: pointer; color: #aaa; border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab-btn.active { color: #e8604c; border-bottom-color: #e8604c; }
.tab-section { display: none; }
.tab-section.active { display: block; }

</style>
</head>
<body>
<div style="background:#fff8e6;color:#8a6d1a;font-size:10px;text-align:center;padding:5px 8px;line-height:1.4;">ℹ️ Données à ~15 min près (retard de remontée côté station, hors de notre contrôle) · rafraîchi toutes les 5 min</div>
<div class="top-bar">
  <div class="top-bar-row">
    <div>
      <div style="font-size:11px;opacity:0.75;">📍 Cintré, Bretagne</div>
      <div class="top-bar-title">🏆 Records</div>
    </div>
    <button class="refresh-btn" onclick="loadData()">↻ Actualiser</button>
  </div>
  <div class="top-bar-sub" id="top-sub">Chargement...</div>
</div>
<div class="month-filter" id="monthFilter"></div>
<div class="tab-bar">
  <button class="tab-btn active" data-tab="temp" onclick="selectTab('temp')">🌡️ Températures</button>
  <button class="tab-btn" data-tab="precip" onclick="selectTab('precip')">🌧️ Précipitations</button>
</div>
<div class="tab-section active" data-tab="temp" id="tab-temp"></div>
<div class="tab-section" data-tab="precip" id="tab-precip"></div>
<div id="content-loading"><div class="loading"><div class="spinner"></div>Chargement...</div></div>
<nav>
  <a href="index.html"><span style="font-size:20px;">🌤️</span>Aujourd'hui</a>
  <a href="detail.html"><span style="font-size:20px;">📅</span>Journée</a>
  <a href="bilan.html"><span style="font-size:20px;">📆</span>Bilan</a>
  <a href="records.html" class="active"><span style="font-size:20px;">🏆</span>Records</a>
  <a href="climat.html"><span style="font-size:20px;">🌍</span>Climat</a>
</nav>
<script>
const PROXY_URL = "https://europe-west9-mystic-aileron-471209-p6.cloudfunctions.net/query-proxy-meteo";

const MOIS = ['Tous','Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
let selectedMonth = 0;
let selectedTab = 'temp';

function selectTab(tab){
  selectedTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===tab); });
  document.querySelectorAll('.tab-section').forEach(function(s){ s.classList.toggle('active', s.dataset.tab===tab); });
}

async function queryBQ(sql){
  const r=await fetch(PROXY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:sql})});
  const d=await r.json();
  if(d.error)throw new Error(d.error);
  return d;
}

function parseRows(res){
  if(!res.rows)return[];
  const f=res.schema.fields.map(f=>f.name);
  return res.rows.map(r=>{const o={};r.f.forEach((v,i)=>o[f[i]]=v.v);return o;});
}

function n(v){return(v!==null&&v!==''&&v!==undefined)?parseFloat(v):null;}
function fmt(v,d=1){return(v!==null&&v!==''&&v!==undefined)?parseFloat(v).toFixed(d):'—';}
function fmtDate(s){if(!s)return'—';const d=new Date(s.includes('T')?s:s+'T12:00:00');return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}
function fmtMonth(s){if(!s)return'—';const[y,m]=s.split('-');const mois=['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];return mois[parseInt(m)-1]+' '+y;}
function fmtDateTime(s){if(!s)return'—';const d=new Date(s);return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}

function recordCardPrecip(icon,iconClass,title,value,unit,label,top10,extra){
  const topRows = top10.map(function(r,i){
    const rc = i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
    return '<tr>'
      +'<td class="'+rc+'">'+(i+1)+'</td>'
      +'<td>'+fmt(n(r.val),1)+'<span style="color:#aaa;font-size:10px;"> '+unit+'</span></td>'
      +'<td>'+r.label+'</td>'
      +'</tr>';
  });
  const firstRow = topRows[0]||'';
  const restRows = topRows.slice(1).join('');
  return '<div class="record-card">'
    +'<div class="record-header"><div class="record-icon '+iconClass+'">'+icon+'</div><div class="record-title">'+title+'</div></div>'
    +'<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:4px;"><div class="record-value">'+fmt(n(value),1)+'</div><div class="record-unit">'+unit+'</div></div>'
    +'<div class="record-date"><b>'+label+'</b></div>'
    +(extra?'<div class="record-extra">'+extra+'</div>':'')
    +'<details>'
    +'<summary>Top 10 <span class="arr">▼</span></summary>'
    +'<table class="top10-table"><tbody>'+firstRow+restRows+'</tbody></table>'
    +'</details>'
    +'</div>';
}

function buildMonthFilter(){
  document.getElementById('monthFilter').innerHTML=MOIS.map(function(m,i){
    return '<button class="month-btn'+(i===selectedMonth?' active':'')+'" onclick="selectMonth('+i+')">'+m+'</button>';
  }).join('');
}

function selectMonth(i){ selectedMonth=i; buildMonthFilter(); loadData(); }

function monthWhere(){ return selectedMonth===0?'':' AND EXTRACT(MONTH FROM DATE(obsTimeUtc, "Europe/Paris"))='+selectedMonth; }
function monthWhereT(){ return ' WHERE TRUE'+monthWhere(); }
function monthWhereP(){ return ' WHERE TRUE AND precipRate < 150'+monthWhere(); }

function recordCard(icon,iconClass,title,value,unit,date,heure,top10,extra,showTm){
  const topRows = top10.map(function(r,i){
    const rc = i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
    const heureCell = r.heure?' <span style="color:#bbb;font-size:10px;">'+r.heure+'</span>':'';
    const tmCell = (showTm&&r.tmax!==null&&r.tmin!==null)?' <span style="color:#bbb;font-size:10px;">'+fmt(r.tmax)+'° / '+fmt(r.tmin)+'°</span>':'';
    return '<tr>'
      +'<td class="'+rc+'">'+(i+1)+'</td>'
      +'<td>'+fmt(n(r.val))+'<span style="color:#aaa;font-size:10px;"> '+unit+'</span></td>'
      +'<td>'+fmtDate(r.jour)+heureCell+tmCell+'</td>'
      +'</tr>';
  });

  const firstRow = topRows[0]||'';
  const restRows = topRows.slice(1).join('');

  return '<div class="record-card">'
    +'<div class="record-header"><div class="record-icon '+iconClass+'">'+icon+'</div><div class="record-title">'+title+'</div></div>'
    +'<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:4px;"><div class="record-value">'+fmt(n(value))+'</div><div class="record-unit">'+unit+'</div></div>'
    +'<div class="record-date">Le <b>'+fmtDate(date)+'</b>'+(heure?' à <b>'+heure+'</b>':'')+'</div>'
    +(extra?'<div class="record-extra">'+extra+'</div>':'')
    +'<details>'
    +'<summary>Top 10 <span class="arr">▼</span></summary>'
    +'<table class="top10-table"><tbody>'+firstRow+restRows+'</tbody></table>'
    +'</details>'
    +'</div>';
}

async function loadData(){
  document.getElementById('content-loading').innerHTML='<div class="loading"><div class="spinner"></div>Chargement...</div>';
  document.getElementById('tab-temp').innerHTML='';
  document.getElementById('tab-precip').innerHTML='';
  document.getElementById('top-sub').textContent=selectedMonth===0?'Tous les mois':'Mois de '+MOIS[selectedMonth];
  const WT = monthWhereT();   // température : sans filtre precipRate
  const WP = monthWhereP();   // précipitations : avec precipRate < 150

  // ---- Température ----
  const qDaily="SELECT jour,temp_max,temp_min,temp_moy,amplitude,jour_min_max,jour_max_min FROM (SELECT DATE(obsTimeUtc, 'Europe/Paris') AS jour,MAX(tempHigh) AS temp_max,MIN(tempLow) AS temp_min,AVG(tempAvg) AS temp_moy,MAX(tempHigh)-MIN(tempLow) AS amplitude,MAX(tempHigh) AS jour_min_max,MIN(tempLow) AS jour_max_min FROM `meteo_cintre.raw_data_v2`"+WT+" GROUP BY jour HAVING COUNT(*)>=280) ORDER BY jour";
  const qDailyAll="SELECT DATE(obsTimeUtc, 'Europe/Paris') AS jour,MAX(tempHigh) AS temp_max,MIN(tempLow) AS temp_min FROM `meteo_cintre.raw_data_v2`"+WT+" GROUP BY jour ORDER BY jour";
  const qTmaxH="SELECT DATE(obsTimeUtc, 'Europe/Paris') AS jour,FORMAT_TIMESTAMP('%H:%M',obsTimeUtc,'Europe/Paris') AS heure FROM `meteo_cintre.raw_data_v2`"+WT+" ORDER BY tempHigh DESC LIMIT 10";
  const qTminH="SELECT DATE(obsTimeUtc, 'Europe/Paris') AS jour,FORMAT_TIMESTAMP('%H:%M',obsTimeUtc,'Europe/Paris') AS heure FROM `meteo_cintre.raw_data_v2`"+WT+" ORDER BY tempLow ASC LIMIT 10";
  // ---- Précipitations ----
  const qPrecipJour="SELECT DATE(obsTimeUtc, 'Europe/Paris') AS jour,SUM(somme) AS total FROM `meteo_cintre.raw_data_v2`"+WP+" GROUP BY jour ORDER BY total DESC LIMIT 10";
  const qPrecip5min="SELECT DATE(obsTimeUtc, 'Europe/Paris') AS jour,FORMAT_TIMESTAMP('%H:%M',obsTimeUtc,'Europe/Paris') AS heure,somme AS val FROM `meteo_cintre.raw_data_v2`"+WP+" ORDER BY somme DESC LIMIT 10";
  const qIntensiteMax="SELECT DATE(obsTimeUtc, 'Europe/Paris') AS jour,FORMAT_TIMESTAMP('%H:%M',obsTimeUtc,'Europe/Paris') AS heure,precipRate AS val FROM `meteo_cintre.raw_data_v2`"+WP+" ORDER BY precipRate DESC LIMIT 10";
    const qMoisPluvieux="SELECT FORMAT_DATE('%Y-%m',DATE(obsTimeUtc, 'Europe/Paris')) AS mois,SUM(somme) AS total FROM `meteo_cintre.raw_data_v2`"+WP+" GROUP BY mois ORDER BY total DESC LIMIT 10";
  const qMoisSec="SELECT FORMAT_DATE('%Y-%m',DATE(obsTimeUtc, 'Europe/Paris')) AS mois,SUM(somme) AS total FROM `meteo_cintre.raw_data_v2`"+WP+" GROUP BY mois ORDER BY total ASC LIMIT 10";

  try{
    const [res,resAll,resTmaxH,resTminH,resPJ,resP5,resInt,resMPluvieux,resMSec]=await Promise.all([
      queryBQ(qDaily),queryBQ(qDailyAll),queryBQ(qTmaxH),queryBQ(qTminH),
      queryBQ(qPrecipJour),queryBQ(qPrecip5min),queryBQ(qIntensiteMax),
      queryBQ(qMoisPluvieux),queryBQ(qMoisSec)
    ]);

    const days=parseRows(res);
    const daysAll=parseRows(resAll);
    const tmaxHeures=parseRows(resTmaxH);
    const tminHeures=parseRows(resTminH);
    const precipJour=parseRows(resPJ);
    const precip5min=parseRows(resP5);
    const intensiteMax=parseRows(resInt);
    const moisPluvieux=parseRows(resMPluvieux);
    const moisSec=parseRows(resMSec);

    if(!days.length){
      document.getElementById('tab-temp').innerHTML='<div style="padding:16px"><div class="error">Aucune donnée pour ce mois.</div></div>';
      return;
    }

    function top10By(key,asc){
      return days.slice().sort(function(a,b){const va=n(a[key]),vb=n(b[key]);if(va===null)return 1;if(vb===null)return-1;return asc?va-vb:vb-va;}).slice(0,10).map(function(r){return {val:r[key],jour:r.jour,tmax:n(r.temp_max),tmin:n(r.temp_min),heure:null};});
    }
    function top10ByArr(arr,key,asc){
      return arr.slice().sort(function(a,b){const va=n(a[key]),vb=n(b[key]);if(va===null)return 1;if(vb===null)return-1;return asc?va-vb:vb-va;}).slice(0,10).map(function(r){return {val:r[key],jour:r.jour,tmax:n(r.temp_max),tmin:n(r.temp_min),heure:null};});
    }

    const t10TempMax=top10ByArr(daysAll,'temp_max',false).map(function(r){const h=tmaxHeures.find(function(x){return x.jour===r.jour;});return Object.assign({},r,{heure:h?h.heure:null});});
    const t10TempMin=top10ByArr(daysAll,'temp_min',true).map(function(r){const h=tminHeures.find(function(x){return x.jour===r.jour;});return Object.assign({},r,{heure:h?h.heure:null});});
    const t10MoyHigh=top10By('temp_moy',false);
    const t10MoyLow=top10By('temp_moy',true);
    const t10AmpHigh=top10By('amplitude',false);
    const t10AmpLow=top10By('amplitude',true);
    const t10JMinMax=top10By('jour_min_max',true);
    const t10JMaxMin=top10By('jour_max_min',false);

    const t10PrecipJour=precipJour.map(function(r){return {val:n(r.total),label:fmtDate(r.jour)};});
    const t10Precip5min=precip5min.map(function(r){return {val:n(r.val),label:fmtDate(r.jour)+' à '+r.heure};});

    const t10Intensite=intensiteMax.map(function(r){return {val:n(r.val),label:fmtDate(r.jour)+' à '+r.heure};});
    // Filtrage non-chevauchant 1h : exclure toute fenêtre dont le timestamp est à moins de 3600s d'une fenêtre déjà retenue
    const t10MPluvieux=moisPluvieux.map(function(r){return {val:n(r.total),label:fmtMonth(r.mois)};});
    const t10MSec=moisSec.map(function(r){return {val:n(r.total),label:fmtMonth(r.mois)};});

    const r0=t10TempMax[0],r1=t10TempMin[0],r2=t10MoyHigh[0],r3=t10MoyLow[0];
    const r4=t10AmpHigh[0],r5=t10AmpLow[0],r6=t10JMinMax[0],r7=t10JMaxMin[0];
    const p0=t10PrecipJour[0],p2=t10Precip5min[0],p3=t10Intensite[0];
    const p4=t10MPluvieux[0],p5=t10MSec[0];

    const htmlTemp=
      '<div class="section-title">🌡️ Températures extrêmes</div>'
      +'<div class="card-grid">'
      +recordCard('🥵','red','Température max absolue',r0.val,'°C',r0.jour,r0.heure,t10TempMax,null,false)
      +recordCard('🥶','blue','Température min absolue',r1.val,'°C',r1.jour,r1.heure,t10TempMin,null,false)
      +'</div>'
      +'<div class="section-title">📊 Moyennes journalières</div>'
      +'<div class="card-grid">'
      +recordCard('🔥','red','Moyenne la plus élevée',r2.val,'°C',r2.jour,null,t10MoyHigh,null,false)
      +recordCard('❄️','blue','Moyenne la plus basse',r3.val,'°C',r3.jour,null,t10MoyLow,null,false)
      +'</div>'
      +'<div class="section-title">↕️ Amplitude thermique</div>'
      +'<div class="card-grid">'
      +recordCard('📈','amber','Amplitude maximale',r4.val,'°C',r4.jour,null,t10AmpHigh,(r4.tmax!==null?'Max '+fmt(r4.tmax)+'° · Min '+fmt(r4.tmin)+'°':null),true)
      +recordCard('📉','teal','Amplitude minimale',r5.val,'°C',r5.jour,null,t10AmpLow,(r5.tmax!==null?'Max '+fmt(r5.tmax)+'° · Min '+fmt(r5.tmin)+'°':null),true)
      +'</div>'
      +'<div class="section-title">🎯 Records atypiques</div>'
      +'<div class="card-grid">'
      +recordCard('🌡️','amber','Température minimum la plus élevée',r7.val,'°C',r7.jour,null,t10JMaxMin,null,false)
      +recordCard('🌡️','purple','Température maximum la plus basse',r6.val,'°C',r6.jour,null,t10JMinMax,null,false)
      +'</div>';

    const htmlPrecip=
      '<div class="section-title">🌧️ Cumuls</div>'
      +'<div class="card-grid">'
      +recordCardPrecip('📅','blue','Précip. max en 1 journée',p0?p0.val:null,'mm',p0?p0.label:'—',t10PrecipJour,null)
      +'</div>'
      +'<div class="section-title">⚡ Intensité</div>'
      +'<div class="card-grid">'
      +recordCardPrecip('🌧️','blue','Précip. max sur 5 min',p2?p2.val:null,'mm',p2?p2.label:'—',t10Precip5min,null)
      +recordCardPrecip('💧','teal','Intensité max (mm/h)',p3?p3.val:null,'mm/h',p3?p3.label:'—',t10Intensite,null)
      +'</div>'
      +'<div class="section-title">📆 Bilan mensuel</div>'
      +'<div class="card-grid">'
      +recordCardPrecip('🌊','blue','Mois le plus pluvieux',p4?p4.val:null,'mm',p4?p4.label:'—',t10MPluvieux,null)
      +recordCardPrecip('🏜️','amber','Mois le plus sec',p5?p5.val:null,'mm',p5?p5.label:'—',t10MSec,null)
      +'</div>';

    document.getElementById('content-loading').innerHTML='';
    document.getElementById('tab-temp').innerHTML=htmlTemp+'<div class="pb"></div>';
    document.getElementById('tab-precip').innerHTML=htmlPrecip+'<div class="pb"></div>';

  }catch(e){
    document.getElementById('tab-temp').innerHTML='<div style="padding:16px"><div class="error">⚠️ '+e.message+'</div></div>';
  }
}
buildMonthFilter();
loadData();
</script>
</body>
</html>
