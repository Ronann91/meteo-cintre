<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Météo — Cintré (V2)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f7f8fa; color: #1a1a2e; min-height: 100vh; }

.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px 20px 28px; color: white; }
.header-top { display: flex; justify-content: space-between; align-items: flex-start; }
.header-location { font-size: 12px; opacity: 0.8; letter-spacing: 0.05em; text-transform: uppercase; }
.header-title { font-size: 20px; font-weight: 700; margin-top: 2px; }
.header-time { font-size: 11px; opacity: 0.7; margin-top: 3px; }
.refresh-btn { background: rgba(255,255,255,0.2); border: none; border-radius: 20px; padding: 6px 12px; font-size: 12px; color: white; cursor: pointer; white-space: nowrap; }
.refresh-btn:active { background: rgba(255,255,255,0.35); }

.main-temp-card { background: white; margin: -16px 16px 0; border-radius: 20px; padding: 18px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: space-between; }
.main-temp-left { flex: 1; }
.main-temp-label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
.main-temp-value { font-size: 48px; font-weight: 300; color: #1a1a2e; line-height: 1; }
.main-temp-value sup { font-size: 20px; font-weight: 400; color: #888; vertical-align: super; }
.main-temp-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.normales-row { margin-top: 6px; font-size: 10px; color: #bbb; line-height: 1.8; }
.meta-item { font-size: 11px; color: #aaa; line-height: 1.5; }
.meta-item b { display: block; font-size: 13px; font-weight: 600; color: #333; }
.meta-item span { font-size: 10px; color: #bbb; }
.main-temp-icon { font-size: 52px; line-height: 1; margin-left: 12px; }

.kpi-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; padding: 14px 16px 0; }
.kpi-card { background: white; border-radius: 16px; padding: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
.kpi-card.full { grid-column: span 2; }
.kpi-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.kpi-icon { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.kpi-icon.blue { background: #e8f4ff; }
.kpi-icon.teal { background: #e6f9f3; }
.kpi-icon.amber { background: #fff8e6; }
.kpi-icon.purple { background: #f3eeff; }
.kpi-icon.pink { background: #fff0f5; }
.kpi-card-title { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.kpi-card-value { font-size: 26px; font-weight: 600; color: #1a1a2e; line-height: 1; }
.kpi-card-unit { font-size: 13px; font-weight: 400; color: #aaa; }
.kpi-sub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 7px; }
.kpi-sub-item { font-size: 10px; color: #bbb; line-height: 1.6; }
.kpi-sub-item b { display: block; font-size: 12px; font-weight: 600; color: #555; }
.kpi-sub-item span { font-size: 10px; color: #ccc; }
.kpi-sub-single { font-size: 11px; color: #aaa; margin-top: 6px; line-height: 1.6; }
.kpi-sub-single b { color: #555; font-weight: 500; }

.section-header { padding: 18px 16px 8px; font-size: 11px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.07em; }
.chart-card { background: white; border-radius: 16px; margin: 0 16px 10px; padding: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
.chart-card-title { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.chart-card-title span { font-size: 13px; font-weight: 600; color: #1a1a2e; }
.chart-card-title em { font-size: 11px; color: #ccc; font-style: normal; margin-left: auto; }

/* TABLEAU HORAIRE */
.table-section { padding: 0 16px 24px; }
.table-card { background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); overflow: hidden; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 11px; }
thead th { background: #f7f8fa; color: #aaa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 6px; text-align: center; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
thead th:first-child { text-align: left; padding-left: 12px; }
tbody tr { border-bottom: 0.5px solid #f5f5f5; cursor: pointer; transition: background 0.15s; }
tbody tr:hover { background: #f9f9ff; }
tbody tr:last-child { border-bottom: none; }
tbody td { padding: 7px 6px; text-align: center; font-weight: 500; color: #333; }
tbody td:first-child { text-align: left; padding-left: 12px; font-weight: 700; color: #667eea; }

/* MODAL DÉTAIL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: flex; align-items: flex-end; }
.modal { background: white; border-radius: 20px 20px 0 0; width: 100%; max-height: 70vh; overflow-y: auto; padding: 20px 16px 32px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 16px; font-weight: 700; color: #1a1a2e; }
.modal-close { background: #f0f0f0; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.detail-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.detail-table th { color: #aaa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 8px; text-align: center; border-bottom: 1px solid #f0f0f0; }
.detail-table th:first-child { text-align: left; }
.detail-table td { padding: 7px 8px; text-align: center; border-bottom: 0.5px solid #f5f5f5; color: #333; }
.detail-table td:first-child { text-align: left; font-weight: 600; color: #667eea; }
.detail-table tr:last-child td { border-bottom: none; }

.loading { text-align: center; padding: 4rem 1rem; color: #bbb; }
.spinner { width: 30px; height: 30px; border: 3px solid #f0f0f0; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
.error { background: #fff5f5; border-radius: 16px; padding: 14px 16px; margin: 16px; font-size: 13px; color: #e53e3e; }
@keyframes spin { to { transform: rotate(360deg); } }
nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; z-index: 50; }
nav a { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0; text-decoration: none; color: #aaa; font-size: 10px; gap: 3px; }
nav a.active { color: #667eea; font-weight: 600; }
</style>
</head>
<body>
<div style="background:#fff8e6;color:#8a6d1a;font-size:10px;text-align:center;padding:5px 8px;line-height:1.4;">ℹ️ Données à ~15 min près (retard de remontée côté station, hors de notre contrôle) · rafraîchi toutes les 5 min</div>
<div id="app"><div class="loading"><div class="spinner"></div>Chargement...</div></div>
<div id="modal-container"></div>

<script>
const PROXY_URL = "https://europe-west9-mystic-aileron-471209-p6.cloudfunctions.net/query-proxy-meteo";

const NORMALES_RENNES = {
  1: {tmin: 3.3, tmax: 9.2, tmoy: 6.0},
  2: {tmin: 2.9, tmax: 10.3, tmoy: 6.3},
  3: {tmin: 4.5, tmax: 13.2, tmoy: 8.5},
  4: {tmin: 6.0, tmax: 16.0, tmoy: 10.7},
  5: {tmin: 9.3, tmax: 19.3, tmoy: 14.1},
  6: {tmin: 12.1, tmax: 22.6, tmoy: 17.1},
  7: {tmin: 13.7, tmax: 24.8, tmoy: 18.9},
  8: {tmin: 13.7, tmax: 24.8, tmoy: 18.8},
  9: {tmin: 11.4, tmax: 21.9, tmoy: 16.2},
  10: {tmin: 9.3, tmax: 17.2, tmoy: 12.8},
  11: {tmin: 5.9, tmax: 12.5, tmoy: 8.9},
  12: {tmin: 3.6, tmax: 9.6, tmoy: 6.4},
};

let charts = {};
let rawRows = [];
let hourlyRows = [];

async function queryBQ(sql) {
  const r = await fetch(PROXY_URL, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:sql})});
  const d = await r.json();
  if(d.error) throw new Error(d.error);
  return d;
}

function parseRows(res) {
  if(!res.rows) return [];
  const f = res.schema.fields.map(f=>f.name);
  return res.rows.map(r=>{const o={};r.f.forEach((v,i)=>o[f[i]]=v.v);return o;});
}

function n(v) { return (v!==null&&v!==''&&v!==undefined) ? parseFloat(v) : null; }
function fmt(v, d=1) { return (v!==null&&v!==''&&v!==undefined) ? parseFloat(v).toFixed(d) : '—'; }
function pad(x) { return String(x).padStart(2,'0'); }
function tempIcon(t) { if(t===null) return'🌡️'; if(t>=35) return'🥵'; if(t>=25) return'☀️'; if(t>=15) return'🌤️'; if(t>=5) return'🌥️'; return'🥶'; }

// Échelle de couleur : bleu (froid) → rouge (chaud) pour temp, bleu → orange pour pluie/vent
function heatColor(val, min, max, type='default') {
  if(val===null||min===max) return '';
  const ratio = Math.max(0, Math.min(1, (val-min)/(max-min)));
  if(type==='temp') {
    const r = Math.round(55 + ratio*180);
    const g = Math.round(130 - ratio*80);
    const b = Math.round(221 - ratio*190);
    return `background:rgba(${r},${g},${b},0.18);`;
  }
  if(type==='rain') {
    return `background:rgba(74,158,221,${0.08 + ratio*0.35});`;
  }
  if(type==='wind') {
    return `background:rgba(29,158,117,${0.08 + ratio*0.35});`;
  }
  if(type==='humidity') {
    return `background:rgba(100,180,255,${0.08 + ratio*0.35});`;
  }
  return `background:rgba(100,100,200,${0.08 + ratio*0.3});`;
}

function makeChart(id, type, labels, datasets, opts={}) {
  if(charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id).getContext('2d');
  const units = {'cTemp':'°C','cPluie':' mm','cVent':' km/h','cSoleil':' W/m²'};
  const scales = {
    x: {ticks:{color:'#ccc',font:{size:9},maxTicksLimit:7},grid:{color:'rgba(0,0,0,0.03)'}},
    y: {ticks:{color:'#ccc',font:{size:9}},grid:{color:'rgba(0,0,0,0.03)'},...(opts.y0!==false?{beginAtZero:true}:{})}
  };
  if(opts.y2) {
    scales.y2 = {position:'right',ticks:{color:'#e8a020',font:{size:9}},grid:{drawOnChartArea:false},beginAtZero:true};
  }
  charts[id] = new Chart(ctx, {
    type,
    data: {labels, datasets},
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 1,
      animation: false,
      plugins: {
        legend: {display: datasets.length>1, labels:{color:'#ccc',font:{size:10},boxWidth:10,padding:6}},
        tooltip: {
          mode: 'index',
          intersect: false,
          callbacks: {
            label: function(c) {
              return c.dataset.label+': '+parseFloat(c.parsed.y).toFixed(1)+(units[id]||'');
            }
          }
        }
      },
      scales: scales
    }
  });
}

function windDirLabel(deg) {
  if(deg===null||deg===undefined||deg==='') return '—';
  const d = parseFloat(deg);
  if(isNaN(d)) return '—';
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
  return dirs[Math.round(d/22.5)%16];
}

function showModal(heure) {
  const rows = rawRows.filter(r => r.heure.startsWith(heure));
  if(!rows.length) return;

  const mm = (arr, key) => { const v=arr.map(r=>n(r[key])).filter(x=>x!==null); return v.length?[Math.min(...v),Math.max(...v)]:[0,0]; };
  const [thMn,thMx]=mm(rows,'tempHigh'); const [tlMn,tlMx]=mm(rows,'tempLow'); const [taMn,taMx]=mm(rows,'tempAvg');
  const [plMn,plMx]=mm(rows,'pluie'); const [prMn,prMx]=mm(rows,'pluie_rate');
  const [vMn,vMx]=mm(rows,'vent'); const [rMn,rMx]=mm(rows,'rafale');
  const [hMn,hMx]=mm(rows,'humidite');

  const html = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">Détail ${heure}h — ${rows.length} mesures</div>
          <button class="modal-close" onclick="document.getElementById('modal-container').innerHTML=''">✕</button>
        </div>
        <div style="overflow-x:auto;">
          <table class="detail-table">
            <thead>
              <tr>
                <th>Heure</th>
                <th>T°Max</th>
                <th>T°Min</th>
                <th>T°Moy</th>
                <th>Pluie</th>
                <th>Intensité</th>
                <th>Vent</th>
                <th>Rafale</th>
                <th>Dir.</th>
                <th>Humidité</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r=>`<tr>
                <td>${r.heure}</td>
                <td style="${heatColor(n(r.tempHigh),thMn,thMx,'temp')}">${fmt(n(r.tempHigh))}°</td>
                <td style="${heatColor(n(r.tempLow),tlMn,tlMx,'temp')}">${fmt(n(r.tempLow))}°</td>
                <td style="${heatColor(n(r.tempAvg),taMn,taMx,'temp')}">${fmt(n(r.tempAvg))}°</td>
                <td style="${heatColor(n(r.pluie),plMn,plMx,'rain')}">${fmt(n(r.pluie))} mm</td>
                <td style="${heatColor(n(r.pluie_rate),prMn,prMx,'rain')}">${n(r.pluie_rate)>0?fmt(n(r.pluie_rate))+' mm/h':'—'}</td>
                <td style="${heatColor(n(r.vent),vMn,vMx,'wind')}">${fmt(n(r.vent))} km/h</td>
                <td style="${heatColor(n(r.rafale),rMn,rMx,'wind')}">${fmt(n(r.rafale))} km/h</td>
                <td>${windDirLabel(r.dir_vent)}</td>
                <td style="${heatColor(n(r.humidite),hMn,hMx,'humidity')}">${fmt(n(r.humidite),0)}%</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-container').innerHTML = html;
}

function closeModal(e) {
  if(e.target.classList.contains('modal-overlay')) {
    document.getElementById('modal-container').innerHTML = '';
  }
}

function buildHourlyTable(rows) {
  const byHour = {};
  rows.forEach(r => {
    const h = r.heure.substring(0,2);
    if(!byHour[h]) byHour[h] = [];
    byHour[h].push(r);
  });

  const hours = Object.keys(byHour).sort();
  const agg = hours.map(h => {
    const rr = byHour[h];
    // Direction dominante : dernière valeur de l'heure
    const lastDir = rr[rr.length-1].dir_vent;
    return {
      heure: h+'h',
      temp_max: Math.max(...rr.map(r=>n(r.tempHigh)).filter(v=>v!==null)),
      temp_min: Math.min(...rr.map(r=>n(r.tempLow)).filter(v=>v!==null)),
      temp_moy: rr.reduce((s,r)=>s+(n(r.tempAvg)||0),0)/rr.length,
      pluie: rr.reduce((s,r)=>s+(n(r.pluie)||0),0),
      intensite_max: Math.max(...rr.map(r=>n(r.pluie_rate)).filter(v=>v!==null)),
      vent_moy: rr.reduce((s,r)=>s+(n(r.vent)||0),0)/rr.length,
      vent_max: Math.max(...rr.map(r=>n(r.rafale)).filter(v=>v!==null)),
      dir_vent: lastDir,
      humidite_moy: rr.reduce((s,r)=>s+(n(r.humidite)||0),0)/rr.length
    };
  });

  const minmax = arr => { const f=arr.filter(v=>isFinite(v)); return f.length?[Math.min(...f),Math.max(...f)]:[0,0]; };
  const [tmxMn,tmxMx] = minmax(agg.map(r=>r.temp_max));
  const [tmnMn,tmnMx] = minmax(agg.map(r=>r.temp_min));
  const [tmyMn,tmyMx] = minmax(agg.map(r=>r.temp_moy));
  const [plMn,plMx]   = minmax(agg.map(r=>r.pluie));
  const allIntens      = agg.map(r=>r.intensite_max).filter(v=>isFinite(v)&&v>0);
  const [inMn,inMx]   = allIntens.length?[Math.min(...allIntens),Math.max(...allIntens)]:[0,0];
  const [vmMn,vmMx]   = minmax(agg.map(r=>r.vent_moy));
  const [vxMn,vxMx]   = minmax(agg.map(r=>r.vent_max));
  const [hmMn,hmMx]   = minmax(agg.map(r=>r.humidite_moy));

  const rows_html = agg.map(r => {
    const h = r.heure.replace('h','');
    return `<tr onclick="showModal('${h}')">
      <td>${r.heure}</td>
      <td style="${heatColor(r.temp_max,tmxMn,tmxMx,'temp')}">${fmt(r.temp_max)}°</td>
      <td style="${heatColor(r.temp_min,tmnMn,tmnMx,'temp')}">${fmt(r.temp_min)}°</td>
      <td style="${heatColor(r.temp_moy,tmyMn,tmyMx,'temp')}">${fmt(r.temp_moy)}°</td>
      <td style="${heatColor(r.pluie,plMn,plMx,'rain')}">${fmt(r.pluie)} mm</td>
      <td style="${heatColor(r.intensite_max,inMn,inMx,'rain')}">${isFinite(r.intensite_max)&&r.intensite_max>0?fmt(r.intensite_max)+' mm/h':'—'}</td>
      <td style="${heatColor(r.vent_moy,vmMn,vmMx,'wind')}">${fmt(r.vent_moy)}</td>
      <td style="${heatColor(r.vent_max,vxMn,vxMx,'wind')}">${isFinite(r.vent_max)?fmt(r.vent_max):'—'}</td>
      <td>${windDirLabel(r.dir_vent)}</td>
      <td style="${heatColor(r.humidite_moy,hmMn,hmMx,'humidity')}">${fmt(r.humidite_moy,0)}%</td>
    </tr>`;
  }).join('');

  return `
    <div class="table-section">
      <div class="section-header" style="padding-left:0;">Tableau horaire — cliquer pour le détail</div>
      <div class="table-card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Heure</th>
                <th>T°Max</th>
                <th>T°Min</th>
                <th>T°Moy</th>
                <th>Pluie</th>
                <th>Intens.</th>
                <th>Vent</th>
                <th>Rafale</th>
                <th>Dir.</th>
                <th>Humidité</th>
              </tr>
            </thead>
            <tbody>${rows_html}</tbody>
          </table>
        </div>
      </div>
    </div>`;
}

async function loadData() {
  try {
    const [kpiRes, lastRes, extremesRes, chartRes, hourRes] = await Promise.all([
      queryBQ(`
        SELECT
          MAX(tempHigh) AS temp_max, MIN(tempLow) AS temp_min, AVG(tempAvg) AS temp_moy,
          SUM(somme) AS pluie_total, MAX(precipRate) AS pluie_rate_max,
          MAX(windgustHigh) AS vent_rafale_max,
          AVG(windspeedAvg) AS vent_moy_jour,
          AVG(humidityAvg) AS humidite_moy, MAX(humidityHigh) AS humidite_max, MIN(humidityLow) AS humidite_min,
          MAX(pressureMax) AS pression_max, MIN(pressureMin) AS pression_min,
          SUM(CASE WHEN solarRadiationHigh>120 THEN 5.0/60.0 ELSE 0 END) AS ens_h
        FROM \`meteo_cintre.raw_data_v2\`
        WHERE DATE(obsTimeUtc, 'Europe/Paris') = CURRENT_DATE('Europe/Paris')
      `),
      queryBQ(`
        SELECT tempHigh AS temp_actuelle, windspeedAvg AS vent_actuel,
               humidityAvg AS hum_actuelle, humidityHigh AS hum_high_actuelle, humidityLow AS hum_low_actuelle,
               pressureMax AS pression_actuelle,
               solarRadiationHigh AS soleil_actuel,
               FORMAT_TIMESTAMP('%H:%M', obsTimeUtc, 'Europe/Paris') AS heure
        FROM \`meteo_cintre.raw_data_v2\`
        WHERE DATE(obsTimeUtc, 'Europe/Paris') = CURRENT_DATE('Europe/Paris')
        ORDER BY obsTimeUtc DESC LIMIT 1
      `),
      queryBQ(`
        SELECT
          FORMAT_TIMESTAMP('%H:%M', t_max.obsTimeLocal, 'Europe/Paris') AS heure_temp_max,
          FORMAT_TIMESTAMP('%H:%M', t_min.obsTimeLocal, 'Europe/Paris') AS heure_temp_min,
          FORMAT_TIMESTAMP('%H:%M', p_max.obsTimeLocal, 'Europe/Paris') AS heure_pluie_max,
          FORMAT_TIMESTAMP('%H:%M', h_max.obsTimeLocal, 'Europe/Paris') AS heure_hum_max,
          FORMAT_TIMESTAMP('%H:%M', h_min.obsTimeLocal, 'Europe/Paris') AS heure_hum_min,
          FORMAT_TIMESTAMP('%H:%M', v_max.obsTimeLocal, 'Europe/Paris') AS heure_vent_max
        FROM
          (SELECT obsTimeUtc AS obsTimeLocal FROM \`meteo_cintre.raw_data_v2\` WHERE DATE(obsTimeUtc, 'Europe/Paris') = CURRENT_DATE('Europe/Paris') ORDER BY tempHigh DESC LIMIT 1) t_max,
          (SELECT obsTimeUtc AS obsTimeLocal FROM \`meteo_cintre.raw_data_v2\` WHERE DATE(obsTimeUtc, 'Europe/Paris') = CURRENT_DATE('Europe/Paris') ORDER BY tempLow ASC LIMIT 1) t_min,
          (SELECT obsTimeUtc AS obsTimeLocal FROM \`meteo_cintre.raw_data_v2\` WHERE DATE(obsTimeUtc, 'Europe/Paris') = CURRENT_DATE('Europe/Paris') ORDER BY precipRate DESC LIMIT 1) p_max,
          (SELECT obsTimeUtc AS obsTimeLocal FROM \`meteo_cintre.raw_data_v2\` WHERE DATE(obsTimeUtc, 'Europe/Paris') = CURRENT_DATE('Europe/Paris') ORDER BY humidityHigh DESC LIMIT 1) h_max,
          (SELECT obsTimeUtc AS obsTimeLocal FROM \`meteo_cintre.raw_data_v2\` WHERE DATE(obsTimeUtc, 'Europe/Paris') = CURRENT_DATE('Europe/Paris') ORDER BY humidityLow ASC LIMIT 1) h_min,
          (SELECT obsTimeUtc AS obsTimeLocal FROM \`meteo_cintre.raw_data_v2\` WHERE DATE(obsTimeUtc, 'Europe/Paris') = CURRENT_DATE('Europe/Paris') ORDER BY windgustHigh DESC LIMIT 1) v_max
      `),
      queryBQ(`
        SELECT
          FORMAT_TIMESTAMP('%H:%M', obsTimeUtc, 'Europe/Paris') AS heure,
          tempHigh, tempLow,
          AVG(tempAvg) OVER (ORDER BY obsTimeUtc ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS tempMoyCumul,
          somme AS pluie, precipRate AS pluie_rate,
          windspeedAvg AS vent, windgustHigh AS rafale, winddirAvg AS dir_vent,
          humidityAvg AS humidite, pressureMax AS pression, solarRadiationHigh AS soleil,
          tempAvg
        FROM \`meteo_cintre.raw_data_v2\`
        WHERE DATE(obsTimeUtc, 'Europe/Paris') = CURRENT_DATE('Europe/Paris')
        ORDER BY obsTimeUtc ASC
      `),
      queryBQ(`
        SELECT
          FORMAT_TIMESTAMP('%H', obsTimeUtc, 'Europe/Paris') AS heure,
          MAX(tempHigh) AS temp_max, MIN(tempLow) AS temp_min, AVG(tempAvg) AS temp_moy,
          SUM(somme) AS pluie, MAX(precipRate) AS intensite_max,
          AVG(windspeedAvg) AS vent_moy, MAX(windgustHigh) AS vent_max
        FROM \`meteo_cintre.raw_data_v2\`
        WHERE DATE(obsTimeUtc, 'Europe/Paris') = CURRENT_DATE('Europe/Paris')
        GROUP BY heure ORDER BY heure ASC
      `)
    ]);

    const k = parseRows(kpiRes)[0] || {};
    const last = parseRows(lastRes)[0] || {};
    const ex = parseRows(extremesRes)[0] || {};
    const rows = parseRows(chartRes);
    rawRows = rows;
    hourlyRows = parseRows(hourRes);

    const labels = rows.map(r=>r.heure);
    const tempActuelle = n(last.temp_actuelle);
    const delta = (n(k.temp_max)!==null&&n(k.temp_min)!==null) ? (n(k.temp_max)-n(k.temp_min)).toFixed(1) : '—';
    const ensH = parseFloat(k.ens_h||0);
    const ensHH = Math.floor(ensH);
    const ensMM = Math.round((ensH-ensHH)*60);
    const ensStr = ensHH>0 ? `${ensHH}H${pad(ensMM)}` : `${ensMM}min`;
    const now = new Date();
    const dateStr = now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

    // Calcul écarts vs normales Rennes
    const _mois = new Date().getMonth()+1;
    const _nr = NORMALES_RENNES[_mois];
    function _ecart(val, ref) {
      if(val===null||val===undefined||!isFinite(val)) return '';
      const d = parseFloat((val-ref).toFixed(1));
      const sign = d>=0?'+':'';
      const col = d>=5?'#b71c1c':d>=0.5?'#e8604c':d<=-5?'#0d47a1':d<=-0.5?'#4a9edd':'#999';
      return '<span style="color:'+col+';font-size:10px;font-weight:600;margin-left:3px;">'+sign+d+'°</span>';
    }
    const _ecartMax = _ecart(n(k.temp_max), _nr.tmax);
    const _ecartMin = _ecart(n(k.temp_min), _nr.tmin);
    const _ecartMoy = _ecart(n(k.temp_moy), _nr.tmoy);

    document.getElementById('app').innerHTML = `
      <div class="header">
        <div class="header-top">
          <div>
            <div class="header-location">📍 Cintré, Bretagne</div>
            <div class="header-title">Suivi journée en cours</div>
            <div class="header-time">${dateStr} · dernière donnée ${last.heure||'—'}</div>
          </div>
          <button class="refresh-btn" onclick="loadData()">↻ Actualiser</button>
        </div>
      </div>

      <div class="main-temp-card">
        <div class="main-temp-left">
          <div class="main-temp-label">Température actuelle</div>
          <div class="main-temp-value">${fmt(tempActuelle)}<sup>°C</sup></div>
          <div class="main-temp-meta">
            <div class="meta-item"><b>↑ ${fmt(k.temp_max)}°C${_ecartMax}</b><span>${ex.heure_temp_max||'—'}</span></div>
            <div class="meta-item"><b>↓ ${fmt(k.temp_min)}°C${_ecartMin}</b><span>${ex.heure_temp_min||'—'}</span></div>
            <div class="meta-item"><b>Moy ${fmt(k.temp_moy)}°C${_ecartMoy}</b></div>
            <div class="meta-item"><b>Δ ${delta}°C</b></div>
          </div>
          <div style="font-size:9px;color:#ccc;margin-top:5px;line-height:1.4;">
            Écarts vs normales Rennes-Saint-Jacques (réf. 1991–2020, Météo-France)
          </div>
        </div>
        <div class="main-temp-icon">${tempIcon(tempActuelle)}</div>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-card-header"><div class="kpi-icon blue">🌧️</div><div class="kpi-card-title">Pluie du jour</div></div>
          <div class="kpi-card-value">${fmt(k.pluie_total)}<span class="kpi-card-unit"> mm</span></div>
          <div class="kpi-sub-grid">
            <div class="kpi-sub-item"><b>${fmt(k.pluie_rate_max)} mm/h</b><span>Intensité max</span></div>
            <div class="kpi-sub-item"><b>${ex.heure_pluie_max||'—'}</b><span>heure max</span></div>
          </div>
        </div>
        <div class="kpi-card">
          <div class="kpi-card-header"><div class="kpi-icon teal">💨</div><div class="kpi-card-title">Vent</div></div>
          <div class="kpi-card-value">${fmt(n(last.vent_actuel),1)}<span class="kpi-card-unit"> km/h</span></div>
          <div class="kpi-sub-grid">
            <div class="kpi-sub-item"><b>${fmt(k.vent_moy_jour,1)} km/h</b><span>Moy journée</span></div>
            <div class="kpi-sub-item"><b>${fmt(k.vent_rafale_max)} km/h</b><span>Rafale max (56s)</span></div>
            <div class="kpi-sub-item"><b>${ex.heure_vent_max||'—'}</b><span>heure rafale max</span></div>
          </div>
        </div>
        <div class="kpi-card">
          <div class="kpi-card-header"><div class="kpi-icon amber">☀️</div><div class="kpi-card-title">Ensoleillement</div></div>
          <div class="kpi-card-value">${ensStr}</div>
          <div class="kpi-sub-single">Rayonnement actuel<br><b>${fmt(n(last.soleil_actuel),0)} W/m²</b></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-card-header"><div class="kpi-icon pink">💦</div><div class="kpi-card-title">Humidité</div></div>
          <div class="kpi-card-value">${fmt(n(last.hum_actuelle),0)}<span class="kpi-card-unit">%</span></div>
          <div class="kpi-sub-grid">
            <div class="kpi-sub-item"><b>↑ ${fmt(k.humidite_max,0)}%</b><span>${ex.heure_hum_max||'—'}</span></div>
            <div class="kpi-sub-item"><b>↓ ${fmt(k.humidite_min,0)}%</b><span>${ex.heure_hum_min||'—'}</span></div>
            <div class="kpi-sub-item"><b>Moy ${fmt(k.humidite_moy,0)}%</b><span>journée</span></div>
          </div>
        </div>
        <div class="kpi-card full">
          <div class="kpi-card-header"><div class="kpi-icon purple">🔵</div><div class="kpi-card-title">Pression</div></div>
          <div class="kpi-card-value">${fmt(n(last.pression_actuelle),0)}<span class="kpi-card-unit"> hPa</span></div>
          <div class="kpi-sub-single">↑ <b>${fmt(k.pression_max,0)} hPa</b> &nbsp;·&nbsp; ↓ <b>${fmt(k.pression_min,0)} hPa</b></div>
        </div>
      </div>

      ${buildHourlyTable(rows)}

      <div class="section-header">Graphiques du jour</div>
      <div class="chart-card">
        <div class="chart-card-title"><span>🌡️ Température</span><em>°C</em></div>
        <canvas id="cTemp"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-card-title"><span>🌧️ Pluie</span><em>mm</em></div>
        <canvas id="cPluie"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-card-title"><span>💨 Vent</span><em>km/h</em></div>
        <canvas id="cVent"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-card-title"><span>☀️ Rayonnement solaire</span><em>W/m²</em></div>
        <canvas id="cSoleil"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-card-title"><span>💦 Humidité</span><em>%</em></div>
        <canvas id="cHumidite"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-card-title"><span>🔵 Pression</span><em>hPa</em></div>
        <canvas id="cPression"></canvas>
      </div>
    `;

    makeChart('cTemp','line',labels,[
      {label:'Max',data:rows.map(r=>n(r.tempHigh)),borderColor:'#e8604c',backgroundColor:'transparent',tension:0.4,pointRadius:0,borderWidth:2},
      {label:'Min',data:rows.map(r=>n(r.tempLow)),borderColor:'#4a9edd',backgroundColor:'rgba(74,158,221,0.06)',fill:'-1',tension:0.4,pointRadius:0,borderWidth:2},
      {label:'Moy',data:rows.map(r=>n(r.tempMoyCumul)),borderColor:'#bbb',backgroundColor:'transparent',tension:0.4,pointRadius:0,borderWidth:1.5,borderDash:[4,3]}
    ],{y0:false});

    // Graphique pluie : barres horaires + cumul courbe noire + intensité max points
    (function(){
      const byHour = {};
      rows.forEach(function(r){
        const h = r.heure ? r.heure.substring(0,2) : null;
        if(h===null) return;
        if(!byHour[h]) byHour[h] = {pluie:0, intensite:0};
        byHour[h].pluie += n(r.pluie)||0;
        byHour[h].intensite = Math.max(byHour[h].intensite, n(r.pluie_rate)||0);
      });
      const heures = Object.keys(byHour).sort();
      const labelsH = heures.map(function(h){ return h+'h'; });
      const pluieData = heures.map(function(h){ return parseFloat(byHour[h].pluie.toFixed(2)); });
      let cumul = 0;
      const cumulData = heures.map(function(h){ cumul += byHour[h].pluie; return parseFloat(cumul.toFixed(2)); });
      const intensiteData = heures.map(function(h){ return byHour[h].intensite > 0 ? byHour[h].intensite : null; });

      if(charts['cPluie']) charts['cPluie'].destroy();
      const ctx = document.getElementById('cPluie').getContext('2d');
      charts['cPluie'] = new Chart(ctx, {
        type: 'bar',
        data: { labels: labelsH, datasets: [
          {
            label: 'Précip. (mm)',
            data: pluieData,
            backgroundColor: 'rgba(74,158,221,0.6)',
            borderColor: 'rgba(74,158,221,0.8)',
            borderWidth: 1,
            borderRadius: 2,
            yAxisID: 'y'
          },
          {
            label: 'Cumul (mm)',
            data: cumulData,
            type: 'line',
            borderColor: '#1a1a2e',
            backgroundColor: 'transparent',
            tension: 0.3,
            pointRadius: 0,
            borderWidth: 2,
            yAxisID: 'yCumul'
          },
          {
            label: 'Intensité max (mm/h)',
            data: intensiteData,
            type: 'scatter',
            borderColor: 'rgba(0,0,0,0)',
            backgroundColor: '#e8604c',
            pointRadius: 5,
            pointStyle: 'circle',
            yAxisID: 'y'
          }
        ]},
        options: {
          responsive: true, maintainAspectRatio: true, aspectRatio: 1, animation: false,
          plugins: {
            legend: {display: true, labels: {color:'#999', font:{size:10}, boxWidth:10, padding:6}},
            tooltip: {mode:'index', intersect:false, callbacks:{
              label: function(c){
                if(c.datasetIndex===0) return 'Précip.: '+c.parsed.y.toFixed(2)+' mm';
                if(c.datasetIndex===1) return 'Cumul: '+c.parsed.y.toFixed(2)+' mm';
                if(c.parsed.y===null) return null;
                return 'Intensité max: '+c.parsed.y.toFixed(1)+' mm/h';
              }
            }}
          },
          scales: {
            x: {ticks:{color:'#ccc',font:{size:9},maxTicksLimit:12}, grid:{color:'rgba(0,0,0,0.03)'}},
            y: {ticks:{color:'#4a9edd',font:{size:9}}, grid:{color:'rgba(0,0,0,0.03)'}, beginAtZero:true, title:{display:true,text:'mm / mm/h',color:'#4a9edd',font:{size:9}}},
            yCumul: {position:'right', ticks:{color:'#1a1a2e',font:{size:9}}, grid:{drawOnChartArea:false}, beginAtZero:true, title:{display:true,text:'Cumul mm',color:'#1a1a2e',font:{size:9}}}
          }
        }
      });
    })();

    // Graphique vent avec surface colorée par direction (16 secteurs)
    (function(){
      // Palette 16 directions : dégradé N(bleu)→E(jaune)→S(rouge)→O(vert)→N
      const DIR16_COLORS = [
        'rgba(102,126,234,0.55)',  // N
        'rgba(140,140,220,0.55)',  // NNE
        'rgba(180,160,200,0.55)',  // NE
        'rgba(210,180,150,0.55)',  // ENE
        'rgba(245,197,24,0.55)',   // E
        'rgba(240,170,30,0.55)',   // ESE
        'rgba(235,140,60,0.55)',   // SE
        'rgba(235,110,70,0.55)',   // SSE
        'rgba(232,96,76,0.55)',    // S
        'rgba(200,90,100,0.55)',   // SSO
        'rgba(160,100,130,0.55)', // SO
        'rgba(100,120,160,0.55)', // OSO
        'rgba(29,158,117,0.55)',   // O
        'rgba(50,150,150,0.55)',   // ONO
        'rgba(70,140,190,0.55)',   // NO
        'rgba(90,130,215,0.55)',   // NNO
      ];
      const DIR16_LABELS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];

      function dirToColor(deg){
        if(deg===null) return 'rgba(200,200,200,0.3)';
        return DIR16_COLORS[Math.round(deg/22.5)%16];
      }
      function dirToLabel(deg){
        if(deg===null) return '—';
        return DIR16_LABELS[Math.round(deg/22.5)%16];
      }

      // Plugin qui dessine la surface colorée sous la courbe segment par segment
      const coloredFillPlugin = {
        id: 'coloredFill',
        beforeDatasetsDraw: function(chart){
          const ds = chart.data.datasets[0];
          const meta = chart.getDatasetMeta(0);
          const {ctx, chartArea:{bottom}, scales:{x,y}} = chart;
          const dirData = rows.map(function(r){return n(r.dir_vent);});

          ctx.save();
          ctx.beginPath();
          ctx.rect(chart.chartArea.left, chart.chartArea.top, chart.chartArea.width, chart.chartArea.height);
          ctx.clip();

          for(let i=0;i<meta.data.length-1;i++){
            const p1 = meta.data[i];
            const p2 = meta.data[i+1];
            if(!p1||!p2) continue;
            const x1=p1.x, x2=p2.x;
            const y1=p1.y, y2=p2.y;
            const color = dirToColor(dirData[i]);
            ctx.beginPath();
            ctx.moveTo(x1, bottom);
            ctx.lineTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x2, bottom);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
          }
          ctx.restore();
        }
      };

      // Légende custom 4 points cardinaux
      const legendDatasets = [
        {label:'Nord',  borderColor:'rgba(102,126,234,0.8)',backgroundColor:'rgba(102,126,234,0.8)',data:[],pointRadius:0,borderWidth:8,type:'line'},
        {label:'Est',   borderColor:'rgba(245,197,24,0.8)', backgroundColor:'rgba(245,197,24,0.8)', data:[],pointRadius:0,borderWidth:8,type:'line'},
        {label:'Sud',   borderColor:'rgba(232,96,76,0.8)',  backgroundColor:'rgba(232,96,76,0.8)',  data:[],pointRadius:0,borderWidth:8,type:'line'},
        {label:'Ouest', borderColor:'rgba(29,158,117,0.8)', backgroundColor:'rgba(29,158,117,0.8)', data:[],pointRadius:0,borderWidth:8,type:'line'},
      ];

      if(charts['cVent']) charts['cVent'].destroy();
      const ctx = document.getElementById('cVent').getContext('2d');
      charts['cVent'] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Vent moy.',
              data: rows.map(function(r){return n(r.vent);}),
              borderColor: 'rgba(30,30,30,0.7)',
              backgroundColor: 'transparent',
              fill: false,
              tension: 0.3,
              pointRadius: 0,
              borderWidth: 1.5
            },
            {
              label: 'Rafale',
              data: rows.map(function(r){return n(r.rafale);}),
              borderColor: 'rgba(150,150,150,0.6)',
              backgroundColor: 'transparent',
              tension: 0.3,
              pointRadius: 0,
              borderWidth: 1,
              borderDash: [3,3]
            }
          ].concat(legendDatasets)
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          aspectRatio: 1,
          animation: false,
          plugins: {
            legend: {
              display: true,
              labels: {
                color: '#999', font:{size:10}, boxWidth:12, padding:8,
                filter: function(item){ return item.datasetIndex >= 1; }
              }
            },
            tooltip: {
              mode: 'index', intersect: false,
              callbacks: {
                label: function(c){
                  if(c.datasetIndex===0){
                    const dir = n(rows[c.dataIndex]&&rows[c.dataIndex].dir_vent);
                    return 'Vent: '+c.parsed.y.toFixed(1)+' km/h ('+dirToLabel(dir)+')';
                  }
                  if(c.datasetIndex===1) return 'Rafale: '+c.parsed.y.toFixed(1)+' km/h';
                  return null;
                }
              }
            }
          },
          scales: {
            x:{ticks:{color:'#ccc',font:{size:9},maxTicksLimit:7},grid:{color:'rgba(0,0,0,0.03)'}},
            y:{ticks:{color:'#ccc',font:{size:9}},grid:{color:'rgba(0,0,0,0.04)'},beginAtZero:true}
          }
        },
        plugins: [coloredFillPlugin]
      });
    })();

    makeChart('cSoleil','bar',labels,[
      {label:'Ensoleillement',data:rows.map(r=>n(r.soleil)>150?n(r.soleil):null),backgroundColor:'rgba(245,197,24,0.5)',borderRadius:0,yAxisID:'y'},
      {label:'W/m²',data:rows.map(r=>n(r.soleil)),type:'line',borderColor:'#e8a020',backgroundColor:'transparent',tension:0.3,pointRadius:0,borderWidth:1,yAxisID:'y'}
    ],{y0:true});

    makeChart('cHumidite','line',labels,[
      {label:'Humidité',data:rows.map(r=>n(r.humidite)),borderColor:'#4a9edd',backgroundColor:'rgba(74,158,221,0.08)',fill:true,tension:0.3,pointRadius:0,borderWidth:2}
    ],{y0:true});

    makeChart('cPression','line',labels,[
      {label:'Pression',data:rows.map(r=>n(r.pression)),borderColor:'#764ba2',backgroundColor:'rgba(118,75,162,0.08)',fill:true,tension:0.3,pointRadius:0,borderWidth:2}
    ],{y0:false});


    } catch(e) {
    // Calcul écarts vs normales Rennes
    const _mois = new Date().getMonth()+1;
    const _nr = NORMALES_RENNES[_mois];
    function _ecart(val, ref) {
      if(val===null||val===undefined||!isFinite(val)) return '';
      const d = parseFloat((val-ref).toFixed(1));
      const sign = d>=0?'+':'';
      const col = d>=5?'#b71c1c':d>=0.5?'#e8604c':d<=-5?'#0d47a1':d<=-0.5?'#4a9edd':'#999';
      return '<span style="color:'+col+';font-size:10px;font-weight:600;margin-left:3px;">'+sign+d+'°</span>';
    }
    const _ecartMax = _ecart(n(k.temp_max), _nr.tmax);
    const _ecartMin = _ecart(n(k.temp_min), _nr.tmin);
    const _ecartMoy = _ecart(n(k.temp_moy), _nr.tmoy);

    document.getElementById('app').innerHTML = `<div style="padding:16px"><div class="error">⚠️ ${e.message}</div></div>`;
  }
}

loadData();
setInterval(loadData, 5*60*1000);
</script>
